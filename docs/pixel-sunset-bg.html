<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정산어택 – 픽셀 석양 배경</title>
<!--
================================================================================
  정산어택 로그인 배경 — 픽셀 도트 아트 / 해 진 직후 / 애니메이션
================================================================================

  [클로드 코드에게 넘길 때 알아둘 것]

  - 이 파일은 그대로 열면 바로 돌아가는 완성본입니다. 아래 <script> 안의
    PixelSunset IIFE 전체를 컴포넌트로 옮기면 됩니다.
    React라면: useRef로 <canvas> 잡고, useEffect 안에서 init(canvas) 호출,
    cleanup에서 destroy() 호출. 그게 전부입니다. 의존성 0개.

  - 이미지 파일이 아니라 캔버스에 매 프레임 그립니다. 그래서
    해상도가 올라가도 안 깨지고, 헤드리스로 PNG 뽑을 필요가 없습니다.

  - 안티에일리어싱을 완전히 배제하려고 ctx.fillRect가 아니라
    ImageData에 픽셀을 직접 씁니다. 이게 "진짜 도트"처럼 보이는 핵심이라
    fillRect/drawImage로 리팩터링하지 마세요. 뭉개집니다.

  - 그라데이션은 CSS gradient가 아니라 13단계 팔레트 + 베이어 4x4 디더링입니다.
    하늘의 오돌토돌한 점 패턴이 그거고, 도트 느낌의 8할이 여기서 나옵니다.

  - fps를 12로 일부러 낮췄습니다. 60fps로 올리면 물결이 매끄러워지면서
    도트 애니메이션 특유의 느낌이 사라집니다. 버그 아닙니다.

  [톤 조절 노브 — CFG에서 만지면 됩니다]
    CFG.fps            애니메이션 속도감 (8~15 권장)
    CFG.targetArtWidth 도트 굵기. 값이 작을수록 픽셀이 굵어짐 (380~560)
    CFG.seed           도시 스카이라인 배치. 숫자만 바꾸면 다른 도시가 나옴
    SKY[]              하늘 팔레트. 위->아래 순서. 지금은 "해 진 직후"라
                       위쪽이 충분히 어두워서 다크 로그인 카드가 잘 읽힘
    CFG.glowX          노을 잔광 중심 위치 (0~1, 화면 가로 비율)

  [주의]
    - 배경이 밝아지면 로그인 카드 글씨가 죽습니다. 팔레트 위쪽 4단계는
      어둡게 유지하세요.
    - localStorage 안 씁니다. SSR 환경이면 init을 useEffect 안에서만 부르세요.
================================================================================
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #0e1228;
    overflow: hidden;
  }

  /* ── 배경 캔버스 ── */
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
    /* 이 두 줄이 없으면 브라우저가 픽셀을 부드럽게 뭉개버립니다 */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ── 아래는 가독성 확인용 목업. 실제 프로젝트에선 지우세요 ── */
  .stage {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: min(440px, 100%);
    background: rgba(16, 20, 42, 0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 36px 30px 26px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Malgun Gothic", sans-serif;
    color: #e8ecf7;
  }

  .logo {
    width: 60px; height: 60px;
    margin: 0 auto 14px;
    border-radius: 14px;
    background: linear-gradient(150deg, #4a7ff5, #2d5bd8);
    display: grid; place-items: center;
    font-size: 30px;
  }

  .card h1 { font-size: 25px; letter-spacing: -0.5px; margin-bottom: 6px; }

  .sub { font-size: 13px; color: #97a2c0; margin-bottom: 24px; }

  .row {
    display: flex; gap: 12px; text-align: left;
    padding: 13px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
  }

  .num {
    flex: none; width: 24px; height: 24px; border-radius: 7px;
    background: rgba(74, 127, 245, 0.18); color: #7fa6ff;
    font-size: 11px; font-weight: 700;
    display: grid; place-items: center;
  }

  .row b { display: block; font-size: 13.5px; margin-bottom: 3px; }
  .row p { font-size: 12.5px; line-height: 1.55; color: #98a3c1; }
  .row em { font-style: normal; color: #ffc978; }

  .kakao {
    width: 100%; margin-top: 22px; padding: 15px;
    border: 0; border-radius: 12px;
    background: #fee500; color: #191600;
    font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }

  .fine { margin-top: 14px; font-size: 11px; color: #6f7b99; line-height: 1.7; }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="stage">
  <div class="card">
    <div class="logo">💥</div>
    <h1>정산어택</h1>
    <div class="sub">1차, 2차로 끝나지 않는 술자리를 위해</div>

    <div class="row">
      <div class="num">01</div>
      <div>
        <b>N빵으로 나누지 않습니다</b>
        <p>3차에서 누가 빠졌고 4차에서 누가 술을 안 마셨는지까지 <em>차수별로 나눠</em> 계산합니다.</p>
      </div>
    </div>

    <div class="row">
      <div class="num">02</div>
      <div>
        <b>총무 혼자 입력하지 않습니다</b>
        <p>총무는 금액만 넣습니다. 누가 어디에 있었고 술을 마셨는지는 <em>각자 링크에서</em> 체크합니다.</p>
      </div>
    </div>

    <div class="row">
      <div class="num">03</div>
      <div>
        <b>금액만 알려주지 않습니다</b>
        <p><em>"1차 참석·논알콜 → 17,800원"</em> 처럼 왜 그 금액인지 근거를 함께 보여줍니다.</p>
      </div>
    </div>

    <button class="kakao">카카오로 시작하기</button>
    <div class="fine">닉네임과 프로필 사진만 받습니다 · 광고를 넣지 않습니다</div>
  </div>
</div>

<script>
/* ===========================================================================
   PixelSunset — 절차적 픽셀 도트 석양 시티뷰 (의존성 없음)
   init(canvasEl) 호출 → destroy() 로 정리
   =========================================================================== */
const PixelSunset = (function () {
  'use strict';

  /* ---------------------------------------------------------------- config */
  const CFG = {
    seed: 20260821,     // 도시 배치 시드. 바꾸면 다른 스카이라인이 나옴
    fps: 12,            // 도트 애니 특유의 느낌. 올리면 매끄러워지고 느낌은 죽음
    targetArtWidth: 460,// 작을수록 픽셀이 굵어짐
    minPixel: 2,
    maxPixel: 12,
    glowX: 0.66,        // 노을 잔광 중심 (가로 0~1)
  };

  /* -------------------------------------------------------------- palettes */
  // 위(어두운 남색) → 아래(수평선 주황). "막 해 진 직후"라 위쪽을 깊게 눌러
  // 다크 로그인 카드가 항상 읽히도록 함.
  const SKY = [
    [ 13,  17,  38], [ 19,  25,  52], [ 27,  32,  68], [ 39,  37,  82],
    [ 55,  44,  90], [ 76,  51,  94], [102,  58,  93], [131,  69,  87],
    [163,  84,  78], [194, 105,  71], [219, 131,  71], [237, 163,  85],
    [248, 196, 114],
  ];

  // 물은 하늘을 그대로 뒤집으면 밝은 황토색 밭처럼 보입니다.
  // 실제로 물은 하늘보다 훨씬 어둡고 푸르므로 전용 팔레트를 씁니다.
  // 위(수평선쪽·따뜻함) → 아래(가까움·가장 어두움)
  // 너무 어둡게 깔면 난간·사람 실루엣이 물에 묻혀서 안 보입니다.
  // 어둡되 새까맣지는 않은 푸른 보라로 유지해서 검은 실루엣이 뜨게 함.
  const WATER = [
    [ 44,  31,  50], [ 38,  28,  48], [ 33,  26,  47],
    [ 29,  24,  46], [ 26,  23,  45], [ 24,  22,  44],
  ];

  const C = {
    farBuild:   [ 46,  42,  74],
    build:      [ 17,  16,  33],
    buildAlt:   [ 23,  21,  43],
    buildEdge:  [ 31,  28,  54],
    win:        [255, 205, 120],
    winWarm:    [255, 172,  88],
    winPale:    [255, 232, 176],
    winCool:    [150, 190, 232],
    bridge:     [ 14,  13,  28],
    bridgeLit:  [255, 190, 110],
    fg:         [  7,   8,  18],
    fgSoft:     [ 12,  13,  27],
    lamp:       [255, 214, 140],
    phone:      [176, 214, 255],
    star:       [214, 224, 255],
  };

  /* ----------------------------------------------------------------- utils */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 베이어 4x4 순서 디더링 — 밴딩을 도트 패턴으로 흩뿌리는 핵심
  const BAYER = [
    [ 0,  8,  2, 10],
    [12,  4, 14,  6],
    [ 3, 11,  1,  9],
    [15,  7, 13,  5],
  ];
  const bayer = (x, y) => BAYER[y & 3][x & 3] / 16;

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  /* ----------------------------------------------------------------- state */
  let cv, ctx, img, data, W = 0, H = 0, pixelSize = 4;
  let scene = null, rafId = 0, running = false;
  let startTime = 0, lastDraw = -1e9, resizeTimer = 0;

  /* ------------------------------------------------- pixel buffer drawing */
  function px(x, y, c) {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const i = (y * W + x) << 2;
    data[i] = c[0]; data[i + 1] = c[1]; data[i + 2] = c[2]; data[i + 3] = 255;
  }

  function rect(x, y, w, h, c) {
    const x0 = Math.max(0, x | 0), y0 = Math.max(0, y | 0);
    const x1 = Math.min(W, (x + w) | 0), y1 = Math.min(H, (y + h) | 0);
    for (let yy = y0; yy < y1; yy++) {
      let i = (yy * W + x0) << 2;
      for (let xx = x0; xx < x1; xx++) {
        data[i] = c[0]; data[i + 1] = c[1]; data[i + 2] = c[2]; data[i + 3] = 255;
        i += 4;
      }
    }
  }

  const hline = (x, y, len, c) => rect(x, y, len, 1, c);
  const vline = (x, y, len, c) => rect(x, y, 1, len, c);

  function disc(cx, cy, r, c) {
    const r2 = r * r;
    for (let dy = -r; dy <= r; dy++) {
      const dx = Math.floor(Math.sqrt(Math.max(0, r2 - dy * dy)));
      hline(cx - dx, cy + dy, dx * 2 + 1, c);
    }
  }

  // 따뜻한 빛을 더하되, 단계를 6칸으로 끊고 디더링 → 그라데이션이 아니라 도트로 보임
  function warm(c, amt, x, y) {
    const q = Math.floor(amt * 6 + bayer(x, y)) / 6;
    if (q <= 0) return c;
    return [
      clamp(c[0] + q * 92, 0, 255),
      clamp(c[1] + q * 56, 0, 255),
      clamp(c[2] + q * 22, 0, 255),
    ];
  }

  /* ------------------------------------------------------- scene building */
  function buildScene(w, h) {
    const rnd = mulberry32(CFG.seed);
    const s = { W: w, H: h };

    // 하늘을 넓게, 물은 얇게. 물이 두꺼워지면 화면이 밝아져서
    // 로그인 카드 가독성이 같이 죽습니다.
    s.pavementTop = h - clamp(Math.round(h * 0.085), 14, 26);
    s.railTop     = s.pavementTop - clamp(Math.round(h * 0.075), 14, 24);
    s.horizonY    = clamp(
      s.railTop - clamp(Math.round(h * 0.10), 18, 34),
      Math.round(h * 0.30), h - 50
    );
    s.glowCx = Math.round(w * CFG.glowX);

    /* --- 뒤쪽 스카이라인 (안개 낀 먼 도시) --- */
    s.far = [];
    for (let x = -8; x < w + 10;) {
      const bw = 10 + Math.floor(rnd() * 22);
      const bh = 10 + Math.floor(rnd() * Math.min(46, s.horizonY - 16));
      s.far.push({ x, w: bw, h: bh });
      x += bw + Math.floor(rnd() * 4);
    }

    /* --- 앞쪽 스카이라인 + 창문 --- */
    s.near = [];
    for (let x = -6; x < w + 12;) {
      const bw = 9 + Math.floor(rnd() * 20);
      const bh = 16 + Math.floor(rnd() * Math.min(78, s.horizonY - 14));
      const top = s.horizonY - bh;
      const b = {
        x, w: bw, h: bh, top,
        color: rnd() < 0.45 ? C.buildAlt : C.build,
        wins: [],
      };

      // 창문 격자: 2px 창 + 2px 간격
      for (let wy = top + 3; wy < s.horizonY - 3; wy += 4) {
        for (let wx = x + 2; wx < x + bw - 2; wx += 4) {
          if (rnd() < 0.30) continue;              // 빈 자리
          const roll = rnd();
          const col = roll < 0.06 ? C.winCool
                    : roll < 0.30 ? C.winPale
                    : roll < 0.68 ? C.win
                    : C.winWarm;
          b.wins.push({
            x: wx, y: wy, c: col,
            // 해가 막 졌으니 절반 조금 넘게 켜져 있고, 나머지는 천천히 켜짐
            base: rnd() < 0.58,
            phase: rnd() * 100,
            rate: 0.03 + rnd() * 0.10,
          });
        }
      }
      s.near.push(b);
      x += bw + (rnd() < 0.34 ? 1 + Math.floor(rnd() * 3) : 0);
    }

    /* --- 현수교 (왼쪽) --- */
    const bx0 = Math.round(w * 0.01);
    const bx1 = Math.round(w * 0.36);
    const span = bx1 - bx0;
    s.bridge = {
      x0: bx0, x1: bx1,
      t1: bx0 + Math.round(span * 0.30),
      t2: bx0 + Math.round(span * 0.76),
      deckY: s.horizonY - Math.round(clamp(h * 0.045, 10, 20)),
      towerH: Math.round(clamp(h * 0.17, 34, 62)),
      lights: [],
    };
    for (let x = bx0 + 3; x < bx1; x += 7) {
      s.bridge.lights.push({ x, phase: rnd() * 100 });
    }

    /* --- 구름 (아래에서 빛을 받음) --- */
    s.clouds = [];
    const cloudN = 5 + Math.floor(rnd() * 3);
    for (let i = 0; i < cloudN; i++) {
      const cw = 30 + Math.floor(rnd() * 70);
      const ch = 3 + Math.floor(rnd() * 4);
      const rows = [];
      for (let r = 0; r < ch; r++) {
        const inset = Math.round(Math.abs(r - (ch - 1) * 0.6) * (2 + rnd() * 4));
        rows.push({ dx: inset + Math.floor(rnd() * 4), w: cw - inset * 2 });
      }
      s.clouds.push({
        x: rnd() * (w + 120) - 60,
        y: Math.round(s.horizonY * (0.30 + rnd() * 0.58)),
        rows,
        speed: 0.9 + rnd() * 2.2,
      });
    }

    /* --- 별 (위쪽 하늘에만, 희미하게) --- */
    s.stars = [];
    const starN = Math.round(w * h * 0.0009);
    for (let i = 0; i < starN; i++) {
      s.stars.push({
        x: Math.floor(rnd() * w),
        y: Math.floor(rnd() * s.horizonY * 0.52),
        phase: rnd() * 100,
        rate: 0.4 + rnd() * 1.6,
      });
    }

    /* --- 물 반사용 광원 목록 --- */
    s.reflect = [];
    for (const b of s.near) {
      for (const wn of b.wins) {
        if (wn.y < s.horizonY - 26 && rnd() < 0.13) {
          s.reflect.push({ x: wn.x, c: wn.c, len: 2 + Math.floor(rnd() * 5), ph: rnd() * 100 });
        }
      }
    }

    /* --- 전경: 가로등 / 사람 / 강아지 --- */
    s.lampX   = Math.round(w * 0.085);
    s.personX = Math.round(w * 0.225);

    /* --- 새떼 --- */
    s.birds = [];
    for (let i = 0; i < 6; i++) {
      s.birds.push({
        ox: i * 7 + Math.floor(rnd() * 5),
        oy: Math.floor(rnd() * 7) - 3,
        ph: rnd() * 6,
      });
    }
    s.birdY = Math.round(s.horizonY * 0.30);

    return s;
  }

  /* ------------------------------------------------------------- painting */

  function paintSky(t) {
    const s = scene, hz = s.horizonY, last = SKY.length - 1;
    const glowR = Math.max(70, hz * 0.95);
    const gx = s.glowCx;
    // 잔광이 아주 느리게 숨쉼
    const pulse = 0.9 + Math.sin(t * 0.55) * 0.06;

    for (let y = 0; y < hz; y++) {
      const f = (y / hz) * last;
      const i0 = Math.floor(f), fr = f - i0;
      const rowB = BAYER[y & 3];

      for (let x = 0; x < W; x++) {
        const idx = fr > rowB[x & 3] / 16 ? Math.min(i0 + 1, last) : i0;
        let c = SKY[idx];

        // 수평선 잔광
        const dx = (x - gx) * 0.62, dy = (y - hz) * 1.5;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < glowR) {
          const g = (1 - d / glowR);
          c = warm(c, g * g * 0.85 * pulse, x, y);
        }
        const i = (y * W + x) << 2;
        data[i] = c[0]; data[i + 1] = c[1]; data[i + 2] = c[2]; data[i + 3] = 255;
      }
    }
  }

  function paintStars(t) {
    for (const st of scene.stars) {
      const tw = Math.sin(t * st.rate + st.phase);
      if (tw < -0.15) continue;
      const a = 0.35 + tw * 0.35;
      const base = SKY[Math.floor((st.y / scene.horizonY) * (SKY.length - 1))];
      px(st.x, st.y, [
        base[0] + (C.star[0] - base[0]) * a,
        base[1] + (C.star[1] - base[1]) * a,
        base[2] + (C.star[2] - base[2]) * a,
      ]);
    }
  }

  function paintClouds(t) {
    const s = scene;
    for (const cl of s.clouds) {
      let cx = cl.x + t * cl.speed;
      const period = W + 160;
      cx = ((cx % period) + period) % period - 80;
      const cxi = Math.round(cx);

      // 수평선에 가까울수록 아래쪽 가장자리가 주황으로 물듦
      const nearGlow = 1 - clamp(Math.abs(cl.y - s.horizonY) / (s.horizonY * 0.8), 0, 1);

      for (let r = 0; r < cl.rows.length; r++) {
        const row = cl.rows[r];
        const y = cl.y + r;
        const isBottom = r >= cl.rows.length - 2;
        const base = SKY[clamp(
          Math.floor((y / s.horizonY) * (SKY.length - 1)) + (isBottom ? 2 : -2),
          0, SKY.length - 1
        )];
        const lit = isBottom ? 0.30 + nearGlow * 0.55 : 0.05;
        for (let x = cxi + row.dx; x < cxi + row.dx + row.w; x++) {
          px(x, y, warm(base, lit, x, y));
        }
      }
    }
  }

  function paintBirds(t) {
    const s = scene;
    const cycle = 26;                       // 26초마다 한 번 지나감
    const p = (t % cycle) / cycle;
    if (p > 0.55) return;
    const headX = -30 + p * (W + 90) / 0.55;
    for (const b of s.birds) {
      const x = Math.round(headX - b.ox);
      const y = Math.round(s.birdY + b.oy + Math.sin(t * 0.5 + b.ph) * 3);
      // 날개짓: 위/아래 두 포즈만 번갈아 (도트 애니 느낌)
      const up = Math.sin(t * 7 + b.ph) > 0;
      const c = [30, 30, 52];
      if (up) { px(x - 1, y - 1, c); px(x, y, c); px(x + 1, y - 1, c); }
      else    { px(x - 1, y + 1, c); px(x, y, c); px(x + 1, y + 1, c); }
    }
  }

  function paintFarSkyline() {
    const s = scene;
    for (const b of s.far) {
      const top = s.horizonY - b.h;
      for (let y = top; y < s.horizonY; y++) {
        // 아래로 갈수록 하늘빛에 잠기게(대기 원근)
        const k = (y - top) / Math.max(1, b.h);
        const sky = SKY[clamp(Math.floor((y / s.horizonY) * (SKY.length - 1)), 0, SKY.length - 1)];
        const c = [
          C.farBuild[0] + (sky[0] - C.farBuild[0]) * k * 0.55,
          C.farBuild[1] + (sky[1] - C.farBuild[1]) * k * 0.55,
          C.farBuild[2] + (sky[2] - C.farBuild[2]) * k * 0.55,
        ];
        hline(b.x, y, b.w, c);
      }
    }
  }

  function paintBridge(t) {
    const s = scene, br = s.bridge;
    const towerTop1 = br.deckY - br.towerH;
    const sag = Math.round(br.towerH * 0.55);

    // 메인 케이블 (포물선)
    const cableY = (x) => {
      if (x < br.t1) {
        const k = (x - br.x0) / Math.max(1, br.t1 - br.x0);
        return Math.round(br.deckY - 2 - (towerTop1 - br.deckY + 2) * -k);
      }
      if (x > br.t2) {
        const k = (x - br.t2) / Math.max(1, br.x1 - br.t2);
        return Math.round(towerTop1 + (br.deckY - 2 - towerTop1) * k);
      }
      const k = (x - br.t1) / Math.max(1, br.t2 - br.t1);
      return Math.round(towerTop1 + Math.sin(k * Math.PI) * sag);
    };

    for (let x = br.x0; x <= br.x1; x++) {
      const cy = cableY(x);
      px(x, cy, C.bridge);
      // 행어 (수직 케이블)
      if (x % 5 === 0 && cy < br.deckY - 2) {
        vline(x, cy, br.deckY - cy, C.bridge);
      }
    }

    // 상판
    rect(br.x0, br.deckY, br.x1 - br.x0, 2, C.bridge);
    // 주탑
    rect(br.t1 - 1, towerTop1, 2, br.deckY - towerTop1 + 2, C.bridge);
    rect(br.t2 - 1, towerTop1, 2, br.deckY - towerTop1 + 2, C.bridge);

    // 상판 조명 — 하나씩 깜빡
    for (const l of br.lights) {
      const f = Math.sin(t * 1.6 + l.phase);
      if (f < -0.75) continue;
      px(l.x, br.deckY - 1, C.bridgeLit);
      if (f > 0.6) {
        px(l.x, br.deckY - 2, [255, 224, 168]);
      }
    }
  }

  function paintNearSkyline(t) {
    const s = scene;
    for (const b of s.near) {
      rect(b.x, b.top, b.w, b.h, b.color);
      // 옥상 테두리 한 줄 — 실루엣이 뭉치지 않게 분리
      hline(b.x, b.top, b.w, C.buildEdge);

      for (const wn of b.wins) {
        // 켜짐 여부: 기본값 + 아주 느린 점멸
        const wave = Math.sin(t * wn.rate + wn.phase);
        const on = wn.base ? wave > -0.9 : wave > 0.86;
        if (!on) continue;
        rect(wn.x, wn.y, 2, 2, wn.c);
      }
    }
  }

  function paintWater(t) {
    const s = scene;
    const top = s.horizonY, bot = s.pavementTop;
    const depth = Math.max(1, bot - top);
    const wLast = WATER.length - 1;

    for (let y = top; y < bot; y++) {
      const k = (y - top) / depth;                 // 0(먼쪽) ~ 1(가까운쪽)
      const f = k * wLast;
      const i0 = Math.floor(f), fr = f - i0;
      const rowB = BAYER[y & 3];
      // 수평선 바로 아래만 노을을 머금음
      const nearHz = Math.pow(1 - k, 3.4);

      for (let x = 0; x < W; x++) {
        const idx = fr > rowB[x & 3] / 16 ? Math.min(i0 + 1, wLast) : i0;
        let c = WATER[idx];

        if (nearHz > 0.02) c = warm(c, nearHz * 0.16, x, y);

        // 잔광 반사 기둥 — 멀수록 좁고 가까울수록 퍼짐
        const dcol = Math.abs(x - s.glowCx);
        const width = 8 + k * 40;
        if (dcol < width) {
          const g = (1 - dcol / width) * (1 - k * 0.55);
          const wob = Math.sin(y * 0.9 + t * 2.4) * 0.5 + 0.5;
          c = warm(c, g * g * 0.95 * (0.40 + wob * 0.60), x, y);
        }
        const i = (y * W + x) << 2;
        data[i] = c[0]; data[i + 1] = c[1]; data[i + 2] = c[2]; data[i + 3] = 255;
      }

      // 가로 물결 — 프레임마다 위치가 밀려서 반짝임
      if ((y - top) % 3 === 1) {
        const off = Math.round(Math.sin(y * 1.7 + t * 1.9) * 9);
        const hl = WATER[clamp(i0 - 1, 0, wLast)];
        for (let x = ((off % 7) + 7) % 7; x < W; x += 7) {
          px(x, y, [hl[0] + 9, hl[1] + 7, hl[2] + 13]);
        }
      }
    }

    // 창문 불빛 반사 — 세로로 흔들리는 점선
    for (const r of scene.reflect) {
      for (let i = 0; i < r.len; i++) {
        const y = top + 1 + i * 2;
        if (y >= bot) break;
        // 줄마다 흔들림이 달라야 뻣뻣한 막대가 아니라 물에 번진 빛으로 보임
        const wob = Math.round(Math.sin(t * 2.1 + r.ph + i * 0.9) * 1.7);
        const fade = (1 - i / r.len) * 0.34;
        const base = WATER[clamp(Math.floor((i * 2 / depth) * (WATER.length - 1)), 0, WATER.length - 1)];
        px(r.x + wob, y, [
          base[0] + r.c[0] * fade,
          base[1] + r.c[1] * fade * 0.8,
          base[2] + r.c[2] * fade * 0.55,
        ]);
      }
    }

    // 물가 경계선
    hline(0, top, W, [12, 14, 32]);
  }

  function paintForeground(t) {
    const s = scene;

    /* --- 바닥 --- */
    rect(0, s.pavementTop, W, H - s.pavementTop, C.fg);
    // 바닥 질감 (아주 옅은 점)
    for (let y = s.pavementTop + 2; y < H; y += 3) {
      for (let x = (y * 5) % 9; x < W; x += 9) px(x, y, C.fgSoft);
    }

    /* --- 난간 --- */
    const railBot = s.pavementTop;
    rect(0, s.railTop, W, 2, C.fg);              // 윗 레일
    hline(0, s.railTop - 1, W, [26, 26, 50]);    // 레일 상단 하이라이트
    hline(0, railBot - 4, W, C.fg);              // 아랫 레일
    for (let x = 0; x < W; x += 9) {             // 세로 살 (너무 촘촘하면 벽처럼 보임)
      vline(x, s.railTop, railBot - s.railTop - 3, C.fg);
    }

    /* --- 가로등 --- */
    const lx = s.lampX;
    const lampTop = s.railTop - Math.round(clamp(H * 0.20, 34, 68));
    vline(lx, lampTop, s.pavementTop - lampTop, C.fg);
    hline(lx, lampTop, 6, C.fg);
    px(lx + 6, lampTop + 1, C.fg);
    const headX = lx + 6, headY = lampTop + 2;

    const flick = 0.86 + Math.sin(t * 3.1) * 0.05 + Math.sin(t * 11.3) * 0.03;
    // 빛무리 — 디더링해서 도트로 흩뿌림
    const gr = 22;
    for (let dy = -gr; dy <= gr; dy++) {
      for (let dx = -gr; dx <= gr; dx++) {
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d > gr) continue;
        const x = headX + dx, y = headY + dy;
        if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const g = (1 - d / gr);
        const i = (y * W + x) << 2;
        const c = warm([data[i], data[i + 1], data[i + 2]], g * g * g * 1.15 * flick, x, y);
        data[i] = c[0]; data[i + 1] = c[1]; data[i + 2] = c[2];
      }
    }
    rect(headX - 1, headY, 3, 3, C.lamp);
    rect(headX - 1, headY + 3, 3, 1, [255, 236, 190]);

    /* --- 사람 (난간에 기대 폰 보는 실루엣) --- */
    // 사람/강아지가 너무 작으면 실루엣이 안 읽혀서 난간 살하고 뒤섞입니다.
    const pxx = s.personX, feet = s.pavementTop + 1;
    const headTop = feet - 34;
    rect(pxx - 2, headTop, 5, 5, C.fg);            // 머리
    rect(pxx - 1, headTop + 5, 3, 2, C.fg);        // 목/어깨
    rect(pxx - 4, headTop + 6, 9, 13, C.fg);       // 몸통
    rect(pxx - 6, headTop + 9, 3, 7, C.fg);        // 앞으로 모은 팔
    rect(pxx - 3, headTop + 19, 3, 15, C.fg);      // 다리
    rect(pxx + 1, headTop + 19, 3, 15, C.fg);
    // 폰 불빛 — 얼굴 아래를 은은하게 물들임
    const ph = 0.65 + Math.sin(t * 1.3) * 0.35;
    rect(pxx - 7, headTop + 10, 2, 2, [
      C.phone[0] * ph, C.phone[1] * ph, C.phone[2] * ph,
    ]);
    px(pxx - 6, headTop + 7, [C.phone[0] * ph * 0.42 + 22, C.phone[1] * ph * 0.42 + 22, C.phone[2] * ph * 0.5 + 34]);
    px(pxx - 5, headTop + 6, [C.phone[0] * ph * 0.22 + 18, C.phone[1] * ph * 0.22 + 18, C.phone[2] * ph * 0.3 + 28]);

    /* --- 강아지 (꼬리 흔듦) --- */
    const dx0 = pxx + 9;
    rect(dx0, feet - 9, 10, 6, C.fg);              // 몸
    rect(dx0 + 8, feet - 13, 4, 4, C.fg);          // 머리
    px(dx0 + 8, feet - 14, C.fg);                  // 귀
    px(dx0 + 11, feet - 14, C.fg);
    rect(dx0 + 1, feet - 3, 2, 3, C.fg);           // 다리
    rect(dx0 + 6, feet - 3, 2, 3, C.fg);
    const wag = Math.sin(t * 6) > 0 ? -2 : -4;     // 두 포즈만 번갈아
    px(dx0 - 1, feet - 9, C.fg);
    rect(dx0 - 2, feet - 9 + wag, 2, 2, C.fg);

    /* --- 상단 비네트: 네비바 글씨 가독성 --- */
    const vh = Math.round(H * 0.16);
    for (let y = 0; y < vh; y++) {
      const a = (1 - y / vh) * 0.5;
      const q = Math.floor(a * 5 + bayer(0, y)) / 5;
      if (q <= 0) continue;
      for (let x = 0; x < W; x++) {
        if (bayer(x, y) > a) continue;
        const i = (y * W + x) << 2;
        data[i] *= 0.55; data[i + 1] *= 0.55; data[i + 2] *= 0.62;
      }
    }
  }

  /* ----------------------------------------------------------------- loop */
  function drawFrame(t) {
    paintSky(t);
    paintStars(t);
    paintClouds(t);
    paintBirds(t);
    paintFarSkyline();
    paintBridge(t);
    paintNearSkyline(t);
    paintWater(t);
    paintForeground(t);
    ctx.putImageData(img, 0, 0);
  }

  function loop(now) {
    if (!running) return;
    rafId = requestAnimationFrame(loop);
    const interval = 1000 / CFG.fps;
    if (now - lastDraw < interval) return;        // 12fps로 고정
    lastDraw = now;
    drawFrame((now - startTime) / 1000);
  }

  /* --------------------------------------------------------------- resize */
  function resize() {
    const vw = Math.max(1, window.innerWidth);
    const vh = Math.max(1, window.innerHeight);
    pixelSize = clamp(Math.round(vw / CFG.targetArtWidth), CFG.minPixel, CFG.maxPixel);

    W = Math.ceil(vw / pixelSize);
    H = Math.ceil(vh / pixelSize);

    cv.width = W;
    cv.height = H;
    ctx = cv.getContext('2d', { alpha: false });
    ctx.imageSmoothingEnabled = false;

    img = ctx.createImageData(W, H);
    data = img.data;
    scene = buildScene(W, H);

    // 정지 상태에서도 첫 프레임은 보이게
    drawFrame((performance.now() - startTime) / 1000);
  }

  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 140);
  }

  /* ------------------------------------------------------------------ api */
  function init(canvasEl) {
    cv = canvasEl;
    startTime = performance.now();
    resize();
    window.addEventListener('resize', onResize);

    // 접근성: 사용자가 모션 최소화를 켰으면 한 프레임만 그리고 멈춤
    const reduce = window.matchMedia &&
                   window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;

    running = true;
    rafId = requestAnimationFrame(loop);
  }

  function destroy() {
    running = false;
    cancelAnimationFrame(rafId);
    clearTimeout(resizeTimer);
    window.removeEventListener('resize', onResize);
  }

  return { init, destroy, CFG };
})();

PixelSunset.init(document.getElementById('bg'));
</script>
</body>
</html>
