<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" style="color:#131A20"
     aria-label="7개 테이블 조인 실행시간 비교. 주문 200만 행에서 MySQL 23.5초 대 PostgreSQL 5.8초로 4.0배, 주문 607만 행에서 MySQL 85.5초 대 PostgreSQL 18.1초로 4.7배 격차">
  <rect width="640" height="300" fill="#F7F9FA"/>

  <rect x="420" y="18" width="12" height="12" fill="currentColor" opacity=".45"/>
  <text x="438" y="28" font-size="11.5" fill="currentColor" opacity=".75">MySQL 8.4</text>
  <rect x="530" y="18" width="12" height="12" fill="#0B8A73"/>
  <text x="548" y="28" font-size="11.5" fill="#0B8A73">PostgreSQL 16</text>

  <line x1="40" y1="220" x2="600" y2="220" stroke="currentColor" opacity=".3"/>

  <!-- medium: 23.5s / 5.8s -->
  <rect x="140" y="173" width="40" height="47" fill="currentColor" opacity=".45"/>
  <text x="160" y="166" text-anchor="middle" font-size="12" fill="currentColor" opacity=".8">23.5s</text>
  <rect x="188" y="208" width="40" height="12" fill="#0B8A73"/>
  <text x="208" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#0B8A73">5.8s</text>
  <text x="196" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">4.0×</text>
  <text x="196" y="270" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".7">medium (주문 200만)</text>

  <!-- large: 85.5s / 18.1s -->
  <rect x="380" y="49" width="40" height="171" fill="currentColor" opacity=".45"/>
  <text x="400" y="42" text-anchor="middle" font-size="12" fill="currentColor" opacity=".8">85.5s</text>
  <rect x="428" y="184" width="40" height="36" fill="#0B8A73"/>
  <text x="448" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#0B8A73">18.1s</text>
  <text x="436" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">4.7×</text>
  <text x="436" y="270" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".7">large (주문 607만)</text>

  <text x="40" y="292" font-size="11.5" fill="currentColor" opacity=".75">PostgreSQL = 병렬 해시 조인(워커 4) · MySQL = 행당 PK조회 중첩 루프 — 데이터가 커질수록 격차 확대</text>
</svg>
