<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" style="color:#131A20"
     aria-label="행 수에 따른 검사 시간 그래프. 측정값은 2500행 0.83초, 5000행 2.56초, 10000행 8.84초로 선형 기준선보다 가파르게 증가하며, 5000행 단위로 나눠 두 번 처리하면 10000행을 5.12초에 끝낸다">
  <rect width="900" height="400" fill="#F7F9FA"/>
  <defs>
    <marker id="csa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <line x1="110" y1="60"  x2="700" y2="60"  stroke="currentColor" opacity=".12"/>
  <line x1="110" y1="140" x2="700" y2="140" stroke="currentColor" opacity=".12"/>
  <line x1="110" y1="220" x2="700" y2="220" stroke="currentColor" opacity=".12"/>
  <line x1="110" y1="300" x2="700" y2="300" stroke="currentColor" opacity=".35"/>
  <text x="100" y="64"  text-anchor="end" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">9s</text>
  <text x="100" y="144" text-anchor="end" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">6s</text>
  <text x="100" y="224" text-anchor="end" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">3s</text>
  <text x="100" y="304" text-anchor="end" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">0</text>

  <line x1="110" y1="300" x2="110" y2="52" stroke="currentColor" opacity=".35"/>
  <text x="257" y="322" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">2,500</text>
  <text x="405" y="322" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">5,000</text>
  <text x="700" y="322" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">10,000</text>
  <text x="405" y="346" text-anchor="middle" font-size="12.5" fill="currentColor">한 번에 처리한 행 수</text>

  <line x1="110" y1="300" x2="700" y2="211" stroke="currentColor" stroke-width="1.8"
        stroke-dasharray="6 4" opacity=".55"/>
  <text x="600" y="238" font-size="12" fill="currentColor">선형이었다면 3.32초</text>

  <polyline points="110,300 257,278 405,232 700,64" fill="none" stroke="#A63A2B" stroke-width="2.2"/>
  <circle cx="257" cy="278" r="5.5" fill="#A63A2B" stroke="#F7F9FA" stroke-width="2"/>
  <circle cx="405" cy="232" r="5.5" fill="#A63A2B" stroke="#F7F9FA" stroke-width="2"/>
  <circle cx="700" cy="64"  r="6" fill="#A63A2B" stroke="#F7F9FA" stroke-width="2"/>
  <text x="257" y="266" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" font-weight="650" fill="#A63A2B">0.83s</text>
  <text x="393" y="220" text-anchor="end" font-size="12" font-family="ui-monospace, monospace" font-weight="650" fill="#A63A2B">2.56s</text>
  <text x="690" y="56"  text-anchor="end" font-size="13.5" font-family="ui-monospace, monospace" fill="#A63A2B" font-weight="700">8.84s</text>

  <circle cx="700" cy="164" r="6" fill="#0B8A73" stroke="#F7F9FA" stroke-width="2"/>
  <line x1="700" y1="70" x2="700" y2="158" stroke="currentColor" stroke-width="1" opacity=".4" marker-end="url(#csa)"/>
  <text x="712" y="160" font-size="13.5" font-family="ui-monospace, monospace" fill="#0B8A73" font-weight="700">5.12s</text>
  <text x="712" y="177" font-size="12" fill="#0B8A73">5,000 × 2회</text>

  <line x1="110" y1="368" x2="140" y2="368" stroke="#A63A2B" stroke-width="2.2"/>
  <circle cx="125" cy="368" r="4.5" fill="#A63A2B"/>
  <text x="148" y="372" font-size="12" fill="currentColor">통짜 처리 (실측)</text>
  <line x1="280" y1="368" x2="310" y2="368" stroke="currentColor" stroke-width="1.8" stroke-dasharray="6 4" opacity=".55"/>
  <text x="318" y="372" font-size="12" fill="currentColor">선형 기준선</text>
  <circle cx="440" cy="368" r="5" fill="#0B8A73"/>
  <text x="452" y="372" font-size="12" fill="currentColor">청크 분할 (실측값 합)</text>
</svg>
