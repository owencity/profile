<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" style="color:#131A20"
     aria-label="종전에는 JSP와 Seasar2가 MySQL 5를 거쳐 VMware 온프레미스 환경에 수동으로 배포됐고, 이후에는 Git과 Jenkins를 거쳐 IDC 온프레미스 서버에 자동 빌드·배포되며, React와 Spring Boot가 PostgreSQL과 통신하고 Spring Boot가 RabbitMQ를 거쳐 자사몰 API와 연동하는 인프라 구성 비교도">
  <rect width="900" height="470" fill="#F7F9FA"/>
  <defs>
    <marker id="lia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="liar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A63A2B"/>
    </marker>
    <marker id="liag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B8A73"/>
    </marker>
  </defs>

  <text x="16" y="40" font-family="ui-monospace, monospace" font-size="13" fill="#A63A2B" font-weight="700">레거시 아키텍처</text>

  <rect x="90" y="56" width="170" height="56" fill="none" stroke="#A63A2B" stroke-width="1.6"/>
  <text x="175" y="80" text-anchor="middle" font-size="13" fill="#A63A2B">JSP + Seasar2</text>
  <text x="175" y="98" text-anchor="middle" font-size="11.5" fill="#A63A2B" opacity=".85">서버사이드 렌더링</text>

  <line x1="260" y1="84" x2="298" y2="84" stroke="#A63A2B" stroke-width="1.4" marker-end="url(#liar)"/>

  <rect x="298" y="56" width="130" height="56" fill="none" stroke="#A63A2B" stroke-width="1.6"/>
  <text x="363" y="88" text-anchor="middle" font-size="13" fill="#A63A2B">MySQL 5</text>

  <line x1="428" y1="84" x2="466" y2="84" stroke="#A63A2B" stroke-width="1.4" marker-end="url(#liar)"/>

  <rect x="466" y="56" width="210" height="56" fill="none" stroke="#A63A2B" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="571" y="78" text-anchor="middle" font-size="13" fill="#A63A2B">VMware (온프레미스)</text>
  <text x="571" y="96" text-anchor="middle" font-size="11.5" fill="#A63A2B" opacity=".85">자체 배포 · 수동</text>

  <line x1="16" y1="140" x2="884" y2="140" stroke="currentColor" opacity=".2" stroke-dasharray="3 5"/>

  <text x="16" y="178" font-family="ui-monospace, monospace" font-size="13" fill="#0B8A73" font-weight="700">신규 아키텍처</text>

  <text x="160" y="178" font-size="12" fill="currentColor" opacity=".6">배포 파이프라인</text>

  <rect x="90" y="192" width="110" height="52" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="145" y="222" text-anchor="middle" font-size="12.5" fill="currentColor">개발자</text>

  <line x1="200" y1="218" x2="230" y2="218" stroke="currentColor" stroke-width="1.4" marker-end="url(#lia)"/>

  <rect x="230" y="192" width="110" height="52" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="285" y="222" text-anchor="middle" font-size="12.5" fill="currentColor">Git</text>

  <line x1="340" y1="218" x2="370" y2="218" stroke="currentColor" stroke-width="1.4" marker-end="url(#lia)"/>

  <rect x="370" y="192" width="120" height="52" fill="none" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="430" y="214" text-anchor="middle" font-size="12.5" fill="#0B8A73" font-weight="700">Jenkins</text>
  <text x="430" y="232" text-anchor="middle" font-size="11" fill="#0B8A73" opacity=".85">배포 스크립트(sh) 실행</text>

  <line x1="490" y1="218" x2="520" y2="218" stroke="#0B8A73" stroke-width="1.4" marker-end="url(#liag)"/>

  <rect x="520" y="192" width="220" height="52" fill="none" stroke="#0B8A73" stroke-width="1.6"/>
  <text x="630" y="214" text-anchor="middle" font-size="12.5" fill="#0B8A73">IDC 서버 (온프레미스)</text>
  <text x="630" y="232" text-anchor="middle" font-size="11.5" fill="#0B8A73" opacity=".85">Docker 빌드 · 배포</text>

  <text x="90" y="282" font-size="12" fill="currentColor" opacity=".6">런타임 구조</text>

  <rect x="90" y="296" width="110" height="54" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="145" y="328" text-anchor="middle" font-size="12.5" fill="currentColor">Client</text>

  <line x1="200" y1="323" x2="230" y2="323" stroke="currentColor" stroke-width="1.4" marker-end="url(#lia)"/>

  <rect x="230" y="296" width="110" height="54" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="285" y="328" text-anchor="middle" font-size="12.5" fill="currentColor">React</text>

  <line x1="340" y1="323" x2="370" y2="323" stroke="currentColor" stroke-width="1.4" marker-end="url(#lia)"/>

  <rect x="370" y="296" width="140" height="54" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="440" y="328" text-anchor="middle" font-size="12.5" fill="currentColor" font-weight="700">Spring Boot</text>

  <line x1="510" y1="323" x2="540" y2="323" stroke="currentColor" stroke-width="1.4" marker-end="url(#lia)"/>

  <rect x="540" y="296" width="140" height="54" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="610" y="328" text-anchor="middle" font-size="12.5" fill="currentColor">PostgreSQL</text>

  <line x1="440" y1="350" x2="440" y2="392" stroke="currentColor" stroke-width="1.4" marker-end="url(#lia)"/>

  <rect x="370" y="392" width="140" height="52" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="440" y="422" text-anchor="middle" font-size="12.5" fill="currentColor">RabbitMQ</text>

  <line x1="510" y1="418" x2="540" y2="418" stroke="currentColor" stroke-width="1.4" marker-end="url(#lia)"/>

  <rect x="540" y="392" width="170" height="52" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="625" y="414" text-anchor="middle" font-size="12.5" fill="currentColor">자사몰 API</text>
  <text x="625" y="432" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">외부 연동</text>
</svg>
