<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" style="color:#131A20"
     aria-label="동시 쓰기 처리량(commits/sec) 비교. 드라이버가 비대칭이던 오염 측정에서는 MySQL 839 대 PostgreSQL 1,210으로 1.44배 격차였으나, 양쪽 모두 네이티브 C 드라이버로 공정화한 뒤에는 MySQL 946 대 PostgreSQL 1,150으로 1.22배로 줄었다">
  <rect width="640" height="300" fill="#F7F9FA"/>

  <rect x="420" y="18" width="12" height="12" fill="currentColor" opacity=".45"/>
  <text x="438" y="28" font-size="11.5" fill="currentColor" opacity=".75">MySQL 8.4</text>
  <rect x="530" y="18" width="12" height="12" fill="#0B8A73"/>
  <text x="548" y="28" font-size="11.5" fill="#0B8A73">PostgreSQL 16</text>

  <line x1="40" y1="220" x2="600" y2="220" stroke="currentColor" opacity=".3"/>

  <!-- 오염 상태: 839 / 1,210 -->
  <rect x="140" y="104" width="40" height="116" fill="currentColor" opacity=".45"/>
  <text x="160" y="97" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".8">839</text>
  <rect x="188" y="53" width="40" height="167" fill="#A63A2B" opacity=".85"/>
  <text x="208" y="46" text-anchor="middle" font-size="11.5" font-weight="700" fill="#A63A2B">1,210</text>
  <text x="196" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#A63A2B">1.44×</text>
  <text x="196" y="266" text-anchor="middle" font-size="11" fill="currentColor" opacity=".65">측정 오염 상태</text>
  <text x="196" y="280" text-anchor="middle" font-size="10" fill="currentColor" opacity=".55">(MySQL 순수 Python 드라이버)</text>

  <!-- 공정화 후: 946 / 1,150 -->
  <rect x="380" y="90" width="40" height="130" fill="currentColor" opacity=".45"/>
  <text x="400" y="83" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".8">946</text>
  <rect x="428" y="61" width="40" height="159" fill="#0B8A73"/>
  <text x="448" y="54" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0B8A73">1,150</text>
  <text x="436" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#0B8A73">1.22×</text>
  <text x="436" y="266" text-anchor="middle" font-size="11" fill="currentColor" opacity=".65">공정화 후</text>
  <text x="436" y="280" text-anchor="middle" font-size="10" fill="currentColor" opacity=".55">(양쪽 네이티브 C 드라이버)</text>
</svg>
