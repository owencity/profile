<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 0 970 340" role="img" style="color:#131A20"
     aria-label="10만 행 검사 소요 비교. 청크 방식은 23초에 완료, 통짜 호출은 30분 34초에도 미완료로 취소, 청크를 단일 트랜잭션 안에서 돌리면 26분에도 미완료로 취소">
  <rect x="-70" width="970" height="340" fill="#F7F9FA"/>
  <defs>
    <pattern id="chunkHatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#A63A2B" stroke-width="2.4" opacity=".32"/>
    </pattern>
  </defs>

  <line x1="120" y1="258" x2="830" y2="258" stroke="currentColor" opacity=".35"/>
  <line x1="120" y1="258" x2="120" y2="264" stroke="currentColor" opacity=".35"/>
  <line x1="346" y1="258" x2="346" y2="264" stroke="currentColor" opacity=".35"/>
  <line x1="572" y1="258" x2="572" y2="264" stroke="currentColor" opacity=".35"/>
  <line x1="797" y1="258" x2="797" y2="264" stroke="currentColor" opacity=".35"/>
  <text x="120" y="278" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">0</text>
  <text x="346" y="278" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">10분</text>
  <text x="572" y="278" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">20분</text>
  <text x="797" y="278" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="currentColor">30분</text>

  <text x="110" y="86" text-anchor="end" font-size="13" fill="currentColor">청크 방식</text>
  <rect x="120" y="70" width="9" height="24" fill="#0B8A73"/>
  <line x1="129" y1="70" x2="200" y2="44" stroke="#0B8A73" stroke-width="1.2" opacity=".7"/>
  <text x="206" y="42" font-size="14.5" font-family="ui-monospace, monospace" fill="#0B8A73" font-weight="700">23초</text>
  <text x="252" y="42" font-size="12.5" fill="#0B8A73">완료</text>
  <text x="206" y="60" font-size="12" fill="currentColor">사전검증 10.3s + 청크 20회 + 마무리 0.03s</text>

  <text x="110" y="150" text-anchor="end" font-size="13" fill="currentColor">통짜 호출</text>
  <rect x="120" y="134" width="690" height="24" fill="url(#chunkHatch)" stroke="#A63A2B" stroke-width="1.2"/>
  <polyline points="810,134 822,146 810,158" fill="none" stroke="#A63A2B" stroke-width="1.8"/>
  <text x="440" y="151" text-anchor="middle" font-size="13" fill="#A63A2B" font-weight="700">30분 34초 경과 — 미완료 (취소)</text>

  <text x="110" y="214" text-anchor="end" font-size="13" fill="currentColor">청크 + 단일 트랜잭션</text>
  <rect x="120" y="198" width="587" height="24" fill="url(#chunkHatch)" stroke="#A63A2B" stroke-width="1.2"/>
  <polyline points="707,198 719,210 707,222" fill="none" stroke="#A63A2B" stroke-width="1.8"/>
  <text x="410" y="215" text-anchor="middle" font-size="13" fill="#A63A2B" font-weight="700">26분 경과 — 미완료 (취소)</text>

  <line x1="120" y1="300" x2="830" y2="300" stroke="currentColor" opacity=".2"/>
  <text x="120" y="322" font-size="12.5" fill="currentColor">
    세 번째 줄이 핵심입니다 — <tspan font-weight="700">같은 청크 코드라도 트랜잭션 안에서 돌면 원래대로 돌아갑니다.</tspan>
  </text>
</svg>
