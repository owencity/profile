<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" style="color:#131A20"
     aria-label="부분 갱신을 허용하면 반쯤 갱신된 상태가 남고 전량 원복은 직전 상태를 보존한다는 비교. 아래에는 값 하나의 타입 오류가 전량을 무산시키던 문제를 앞단 검증 게이트로 상쇄한 흐름과, 원복 전에 실패 사유를 로그로 내보내는 처리">
  <rect width="900" height="440" fill="#F7F9FA"/>
  <defs>
    <marker id="ear" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="earr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A63A2B"/>
    </marker>
  </defs>

  <rect x="40" y="52" width="390" height="168" fill="none" stroke="#A63A2B" stroke-width="1.6"/>
  <text x="60" y="78" font-size="13" fill="#A63A2B" font-weight="700">부분 갱신 허용</text>

  <rect x="60" y="90" width="200" height="24" fill="none" stroke="currentColor" stroke-width="1" opacity=".55"/>
  <text x="70" y="107" font-size="12" fill="currentColor" opacity=".7">행 1</text>
  <text x="248" y="107" text-anchor="end" font-size="12" font-family="ui-monospace, monospace" fill="currentColor" opacity=".6">반영</text>

  <rect x="60" y="120" width="200" height="24" fill="none" stroke="#A63A2B" stroke-width="1.6"/>
  <text x="70" y="137" font-size="12" fill="#A63A2B">행 2</text>
  <text x="248" y="137" text-anchor="end" font-size="12" font-family="ui-monospace, monospace" fill="#A63A2B">실패</text>

  <rect x="60" y="150" width="200" height="24" fill="none" stroke="currentColor" stroke-width="1" opacity=".55"/>
  <text x="70" y="167" font-size="12" fill="currentColor" opacity=".7">행 3</text>
  <text x="248" y="167" text-anchor="end" font-size="12" font-family="ui-monospace, monospace" fill="currentColor" opacity=".6">반영</text>

  <line x1="272" y1="132" x2="292" y2="132" stroke="#A63A2B" stroke-width="1.4" marker-end="url(#earr)"/>
  <text x="300" y="124" font-size="12.5" fill="#A63A2B" font-weight="700">반쯤 갱신</text>
  <text x="300" y="141" font-size="11.5" fill="#A63A2B">되돌릴 기준이 없다</text>
  <text x="60" y="200" font-size="12" fill="currentColor" opacity=".7">재실행해도 무엇이 이미 반영됐는지 알 수 없다</text>

  <rect x="470" y="52" width="390" height="168" fill="none" stroke="#0B8A73" stroke-width="1.6"/>
  <text x="490" y="78" font-size="13" fill="#0B8A73" font-weight="700">전량 원복</text>

  <rect x="490" y="90" width="200" height="24" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"
        stroke-dasharray="4 3"/>
  <text x="500" y="107" font-size="12" fill="currentColor" opacity=".6">행 1</text>
  <text x="678" y="107" text-anchor="end" font-size="12" font-family="ui-monospace, monospace" fill="currentColor" opacity=".55">원복</text>

  <rect x="490" y="120" width="200" height="24" fill="none" stroke="#A63A2B" stroke-width="1.6"/>
  <text x="500" y="137" font-size="12" fill="#A63A2B">행 2</text>
  <text x="678" y="137" text-anchor="end" font-size="12" font-family="ui-monospace, monospace" fill="#A63A2B">실패</text>

  <rect x="490" y="150" width="200" height="24" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"
        stroke-dasharray="4 3"/>
  <text x="500" y="167" font-size="12" fill="currentColor" opacity=".6">행 3</text>
  <text x="678" y="167" text-anchor="end" font-size="12" font-family="ui-monospace, monospace" fill="currentColor" opacity=".55">원복</text>

  <line x1="702" y1="132" x2="722" y2="132" stroke="#0B8A73" stroke-width="1.4" marker-end="url(#ear)"/>
  <text x="730" y="124" font-size="12.5" fill="#0B8A73" font-weight="700">직전 상태</text>
  <text x="730" y="141" font-size="11.5" fill="#0B8A73">기준이 하나뿐</text>
  <text x="490" y="200" font-size="12" fill="currentColor" opacity=".7">몇 번을 다시 올려도 결과가 같다</text>

  <line x1="40" y1="248" x2="860" y2="248" stroke="currentColor" opacity=".2"/>
  <text x="40" y="272" font-size="13" fill="currentColor">
    <tspan font-weight="700">정책의 대가</tspan>
    <tspan> — 값 하나의 타입 오류가 전량을 무산시킨다. 검증을 반영 앞으로 옮겨 상쇄했다</tspan>
  </text>

  <rect x="40" y="288" width="150" height="52" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="115" y="310" text-anchor="middle" font-size="12.5" fill="currentColor">입력 N행</text>
  <text x="115" y="326" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".65">사람이 채운 값</text>

  <line x1="190" y1="314" x2="215" y2="314" stroke="currentColor" stroke-width="1.4" marker-end="url(#ear)"/>

  <rect x="215" y="288" width="195" height="52" fill="none" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="312" y="310" text-anchor="middle" font-size="12.5" fill="#0B8A73" font-weight="700">앞단 검증 게이트</text>
  <text x="312" y="326" text-anchor="middle" font-size="11.5" fill="#0B8A73">타입 · 필수값 · 형식</text>

  <line x1="410" y1="314" x2="435" y2="314" stroke="currentColor" stroke-width="1.4" marker-end="url(#ear)"/>

  <rect x="435" y="288" width="195" height="52" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="532" y="310" text-anchor="middle" font-size="12.5" fill="currentColor">원자적 반영</text>
  <text x="532" y="326" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".65">전부 아니면 전무</text>

  <line x1="630" y1="314" x2="655" y2="314" stroke="currentColor" stroke-width="1.4" marker-end="url(#ear)"/>
  <rect x="655" y="288" width="150" height="52" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".7"/>
  <text x="730" y="318" text-anchor="middle" font-size="12.5" fill="currentColor" opacity=".85">완료</text>

  <polyline points="312,340 312,364 360,364" fill="none" stroke="#A63A2B" stroke-width="1.4"
            stroke-dasharray="4 3" marker-end="url(#earr)"/>
  <text x="370" y="368" font-size="11.5" fill="#A63A2B">해당 행만 반려 — 한 행 때문에 전량이 무산되지 않는다</text>

  <line x1="40" y1="398" x2="860" y2="398" stroke="currentColor" opacity=".2"/>
  <text x="40" y="422" font-size="12.5" fill="currentColor" opacity=".85">
    원복하면 데이터베이스에는 흔적이 남지 않습니다 — 그래서 <tspan font-weight="700">원복 전에</tspan> 실패 사유를 모아 로그로 내보냅니다.
  </text>
</svg>
