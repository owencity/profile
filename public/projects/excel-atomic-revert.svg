<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" style="color:#131A20"
     aria-label="입력된 행이 앞단 검증 게이트를 거쳐 통과한 행만 원자적 반영 단계로 넘어가고, 검증에 걸린 행은 그 행만 반려되어 나머지 반영에 영향을 주지 않는다는 흐름도">
  <rect width="900" height="220" fill="#F7F9FA"/>
  <defs>
    <marker id="ear" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="earr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A63A2B"/>
    </marker>
  </defs>

  <rect x="40" y="24" width="150" height="52" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="115" y="46" text-anchor="middle" font-size="12.5" fill="currentColor">입력 N행</text>
  <text x="115" y="62" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".65">사람이 채운 값</text>

  <line x1="190" y1="50" x2="215" y2="50" stroke="currentColor" stroke-width="1.4" marker-end="url(#ear)"/>

  <rect x="215" y="24" width="195" height="52" fill="none" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="312" y="46" text-anchor="middle" font-size="12.5" fill="#0B8A73" font-weight="700">앞단 검증 게이트</text>
  <text x="312" y="62" text-anchor="middle" font-size="11.5" fill="#0B8A73">타입 · 필수값 · 형식</text>

  <line x1="410" y1="50" x2="435" y2="50" stroke="currentColor" stroke-width="1.4" marker-end="url(#ear)"/>

  <rect x="435" y="24" width="195" height="52" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="532" y="46" text-anchor="middle" font-size="12.5" fill="currentColor">원자적 반영</text>
  <text x="532" y="62" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".65">검증 통과분만 전부 아니면 전무</text>

  <line x1="630" y1="50" x2="655" y2="50" stroke="currentColor" stroke-width="1.4" marker-end="url(#ear)"/>
  <rect x="655" y="24" width="150" height="52" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".7"/>
  <text x="730" y="54" text-anchor="middle" font-size="12.5" fill="currentColor" opacity=".85">완료</text>

  <polyline points="312,76 312,100 360,100" fill="none" stroke="#A63A2B" stroke-width="1.4"
            stroke-dasharray="4 3" marker-end="url(#earr)"/>
  <text x="370" y="104" font-size="12" fill="#A63A2B">타입 오류 등은 여기서 그 행만 반려 — 원자적 반영 단계까지 가지 않는다</text>

  <line x1="40" y1="134" x2="860" y2="134" stroke="currentColor" opacity=".2"/>
  <text x="40" y="156" font-size="13" fill="currentColor">
    <tspan font-weight="700">원자적 반영</tspan>은 여전히 "전부 아니면 전무"입니다 — 다만 이미 검증을 통과한 행만 그 안에 들어갑니다.
  </text>
  <text x="40" y="176" font-size="13" fill="currentColor">
    그래서 타입 오류 같은 흔한 실패 원인은 트랜잭션에 들어가기 전에 걸러집니다.
  </text>
  <text x="40" y="200" font-size="12.5" fill="currentColor" opacity=".8">
    원복하면 데이터베이스에는 흔적이 남지 않습니다 — 그래서 <tspan font-weight="700">원복 전에</tspan> 실패 사유를 모아 로그로 내보냅니다.
  </text>
</svg>
