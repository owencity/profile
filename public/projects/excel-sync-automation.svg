<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" style="color:#131A20"
     aria-label="이전에는 데이터 정제부터 엑셀 기입 후 자사몰·전표시스템 두 양식으로 각각 변환·업로드하는 9단계 수작업이었고, 이후에는 시스템에서 저장·수정 후 동기화 버튼 또는 새벽 자동 동기화만 누르면 두 시스템에 자동 반영되는 2단계로 줄었다는 비교 흐름도">
  <rect width="900" height="340" fill="#F7F9FA"/>
  <defs>
    <marker id="esa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="esar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A63A2B"/>
    </marker>
    <marker id="esag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B8A73"/>
    </marker>
  </defs>

  <text x="16" y="26" font-family="ui-monospace, monospace" font-size="13" fill="#A63A2B" font-weight="700">이전 — 9단계 수작업</text>

  <rect x="20" y="50" width="100" height="46" fill="none" stroke="#A63A2B" stroke-width="1.4"/>
  <text x="70" y="78" text-anchor="middle" font-size="11.5" fill="#A63A2B">데이터 정제</text>

  <line x1="120" y1="73" x2="145" y2="73" stroke="#A63A2B" stroke-width="1.3" marker-end="url(#esar)"/>

  <rect x="145" y="50" width="100" height="46" fill="none" stroke="#A63A2B" stroke-width="1.4"/>
  <text x="195" y="78" text-anchor="middle" font-size="11.5" fill="#A63A2B">엑셀 기입</text>

  <polyline points="245,73 265,73 265,40 285,40" fill="none" stroke="#A63A2B" stroke-width="1.2" marker-end="url(#esar)"/>
  <polyline points="245,73 265,73 265,106 285,106" fill="none" stroke="#A63A2B" stroke-width="1.2" marker-end="url(#esar)"/>

  <rect x="285" y="20" width="140" height="40" fill="none" stroke="#A63A2B" stroke-width="1.4"/>
  <text x="355" y="45" text-anchor="middle" font-size="11" fill="#A63A2B">자사몰 양식 변환</text>
  <line x1="425" y1="40" x2="450" y2="40" stroke="#A63A2B" stroke-width="1.2" marker-end="url(#esar)"/>
  <rect x="450" y="20" width="110" height="40" fill="none" stroke="#A63A2B" stroke-width="1.4"/>
  <text x="505" y="45" text-anchor="middle" font-size="11" fill="#A63A2B">자사몰 업로드</text>

  <rect x="285" y="86" width="140" height="40" fill="none" stroke="#A63A2B" stroke-width="1.4"/>
  <text x="355" y="111" text-anchor="middle" font-size="11" fill="#A63A2B">전표 양식 변환</text>
  <line x1="425" y1="106" x2="450" y2="106" stroke="#A63A2B" stroke-width="1.2" marker-end="url(#esar)"/>
  <rect x="450" y="86" width="110" height="40" fill="none" stroke="#A63A2B" stroke-width="1.4"/>
  <text x="505" y="111" text-anchor="middle" font-size="11" fill="#A63A2B">전표 업로드</text>

  <text x="600" y="45" font-size="11" fill="currentColor" opacity=".65">자사몰·전표시스템 양식이</text>
  <text x="600" y="60" font-size="11" fill="currentColor" opacity=".65">서로 달라 정제·변환·업로드를</text>
  <text x="600" y="75" font-size="11" fill="currentColor" opacity=".65">각각 반복 — 총 9단계</text>

  <line x1="16" y1="160" x2="884" y2="160" stroke="currentColor" opacity=".2" stroke-dasharray="3 5"/>

  <text x="16" y="196" font-family="ui-monospace, monospace" font-size="13" fill="#0B8A73" font-weight="700">이후 — 2단계</text>

  <rect x="20" y="220" width="150" height="46" fill="none" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="95" y="243" text-anchor="middle" font-size="11.5" fill="#0B8A73" font-weight="700">① 저장 · 수정</text>
  <text x="95" y="258" text-anchor="middle" font-size="10" fill="#0B8A73" opacity=".8">시스템 화면 안에서</text>

  <line x1="170" y1="243" x2="195" y2="243" stroke="#0B8A73" stroke-width="1.4" marker-end="url(#esag)"/>

  <rect x="195" y="220" width="170" height="46" fill="none" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="280" y="243" text-anchor="middle" font-size="11.5" fill="#0B8A73" font-weight="700">② 동기화</text>
  <text x="280" y="258" text-anchor="middle" font-size="10" fill="#0B8A73" opacity=".8">버튼 클릭 · 새벽 자동</text>

  <polyline points="365,243 390,243 390,210 415,210" fill="none" stroke="#0B8A73" stroke-width="1.2" marker-end="url(#esag)"/>
  <polyline points="365,243 390,243 390,276 415,276" fill="none" stroke="#0B8A73" stroke-width="1.2" marker-end="url(#esag)"/>

  <rect x="415" y="190" width="140" height="40" fill="none" stroke="#0B8A73" stroke-width="1.4" opacity=".85"/>
  <text x="485" y="215" text-anchor="middle" font-size="11" fill="#0B8A73">자사몰 자동 반영</text>

  <rect x="415" y="256" width="140" height="40" fill="none" stroke="#0B8A73" stroke-width="1.4" opacity=".85"/>
  <text x="485" y="281" text-anchor="middle" font-size="11" fill="#0B8A73">전표 자동 반영</text>

  <text x="600" y="215" font-size="11" fill="currentColor" opacity=".65">수정이력을 기준으로</text>
  <text x="600" y="230" font-size="11" fill="currentColor" opacity=".65">두 시스템에 필요한 형식으로</text>
  <text x="600" y="245" font-size="11" fill="currentColor" opacity=".65">자동 변환 후 반영</text>

  <text x="16" y="320" font-size="12" fill="currentColor" opacity=".8">사용자가 하는 일은 저장(수정)과 동기화뿐 — 두 시스템 반영은 수정이력을 기준으로 자동 처리됩니다.</text>
</svg>
