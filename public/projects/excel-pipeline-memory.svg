<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" style="color:#131A20"
     aria-label="엑셀 업로드 파이프라인 5단계와 각 단계에서 동시에 메모리에 올라가는 양. 읽기 단계는 행 하나씩이라 얕지만 파싱 결과 누적부터 저장까지는 전량을 보유한다">
  <rect width="900" height="410" fill="#F7F9FA"/>
  <defs>
    <marker id="epm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="40"  y="52" width="150" height="50" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="115" y="74" text-anchor="middle" font-size="13" fill="currentColor">파일 수신·저장</text>
  <text x="115" y="90" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".65">디스크</text>

  <rect x="210" y="52" width="150" height="50" fill="none" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="285" y="74" text-anchor="middle" font-size="13" fill="#0B8A73" font-weight="700">행 단위 읽기</text>
  <text x="285" y="90" text-anchor="middle" font-size="11.5" fill="#0B8A73">읽힐 때마다 콜백</text>

  <rect x="380" y="52" width="150" height="50" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="455" y="74" text-anchor="middle" font-size="13" fill="currentColor">헤더 매칭·변환</text>
  <text x="455" y="90" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".65">빈 행은 제외</text>

  <rect x="550" y="52" width="150" height="50" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="625" y="80" text-anchor="middle" font-size="13" fill="currentColor">검증</text>

  <rect x="720" y="52" width="150" height="50" fill="none" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="795" y="74" text-anchor="middle" font-size="13" fill="#0B8A73" font-weight="700">1,000건 묶음 저장</text>
  <text x="795" y="90" text-anchor="middle" font-size="11.5" fill="#0B8A73">순서 보존 · 진행률</text>

  <line x1="190" y1="77" x2="210" y2="77" stroke="currentColor" stroke-width="1.4" marker-end="url(#epm)"/>
  <line x1="360" y1="77" x2="380" y2="77" stroke="currentColor" stroke-width="1.4" marker-end="url(#epm)"/>
  <line x1="530" y1="77" x2="550" y2="77" stroke="currentColor" stroke-width="1.4" marker-end="url(#epm)"/>
  <line x1="700" y1="77" x2="720" y2="77" stroke="currentColor" stroke-width="1.4" marker-end="url(#epm)"/>

  <text x="40" y="146" font-family="ui-monospace, monospace" font-size="12" fill="currentColor" opacity=".65">동시에 메모리에 올라가는 양</text>
  <line x1="40" y1="300" x2="870" y2="300" stroke="currentColor" opacity=".35"/>

  <rect x="85"  y="286" width="60" height="14" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <rect x="255" y="288" width="60" height="12" fill="#0B8A73" opacity=".85"/>

  <rect x="255" y="190" width="60" height="110" fill="none" stroke="currentColor" stroke-width="1.2"
        stroke-dasharray="5 4" opacity=".45"/>
  <text x="330" y="196" font-size="11.5" fill="currentColor" opacity=".65">통째로 여는 방식이었다면</text>
  <text x="330" y="211" font-size="11.5" fill="currentColor" opacity=".65">이 단계부터 파일 전체</text>

  <rect x="425" y="200" width="60" height="100" fill="none" stroke="#A63A2B" stroke-width="1.5"/>
  <rect x="595" y="200" width="60" height="100" fill="none" stroke="#A63A2B" stroke-width="1.5"/>
  <rect x="765" y="200" width="60" height="100" fill="none" stroke="#A63A2B" stroke-width="1.5"/>
  <rect x="765" y="276" width="60" height="24" fill="#0B8A73" opacity=".8"/>

  <polyline points="425,188 425,178 825,178 825,188" fill="none" stroke="#A63A2B" stroke-width="1.3"/>
  <text x="625" y="170" text-anchor="middle" font-size="12.5" fill="#A63A2B">파싱 결과를 전량 보유 — 여기가 남은 개선 여지</text>

  <text x="115" y="320" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".65">디스크만</text>
  <text x="285" y="320" text-anchor="middle" font-size="11.5" fill="#0B8A73">행 1개</text>
  <text x="455" y="320" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".65">누적</text>
  <text x="625" y="320" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".65">유지</text>
  <text x="795" y="320" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".65">유지 + 1,000건 창</text>

  <line x1="40" y1="348" x2="870" y2="348" stroke="currentColor" opacity=".2"/>
  <text x="40" y="372" font-size="12.5" fill="currentColor" opacity=".8">
    읽기와 쓰기는 이미 묶음 단위입니다. 남은 것은 가운데 — 읽으면서 바로 저장하면 보유량이 상수가 됩니다.
  </text>
  <text x="40" y="393" font-size="12.5" fill="currentColor" opacity=".8">
    지금 구조를 택한 이유는 <tspan font-weight="700">엑셀 순서를 그대로 보존</tspan>해야 하고, 저장 전에 전체 검증이 필요하기 때문입니다.
  </text>
</svg>
