<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 530" role="img" style="color:#131A20"
     aria-label="엑셀 업로드 처리 구조 비교. 기존에는 파일을 받아 저장한 뒤 엑셀 전체를 객체로 만들어 메모리에 올리고 업로드 전체를 하나의 트랜잭션으로 저장했는데, 행이 많아지면 파일 전체를 메모리에 올리지 못해 OOM이 발생했다. 신규 구조에서는 파일을 받은 뒤 행이 읽힐 때마다 콜백으로 처리해 헤더 매칭과 형식 변환을 그 자리에서 끝내고, 앞단 검증 게이트에서 타입과 필수값과 형식을 확인한 뒤 1,000건씩 묶어 청크 단위로 커밋한다. 검증에 걸린 행은 그 행만 반려되어 반영 단계로 가지 않는다. 청크마다 커밋하므로 업로드 전체를 하나의 트랜잭션으로 묶을 수 없는 대신, 청크 처리 상태를 대기 처리중 완료 실패로 테이블에 기록해 중간에 끊겨도 재실행하면 남은 청크부터 이어서 처리한다.">
  <rect width="1060" height="530" fill="#F7F9FA"/>
  <defs>
    <marker id="xa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="xar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A63A2B"/>
    </marker>
    <marker id="xag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B8A73"/>
    </marker>
    <marker id="xbig" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#131A20"/>
    </marker>
  </defs>

  <!-- 기존 -->
  <text x="16" y="40" font-family="ui-monospace, monospace" font-size="15" fill="#A63A2B" font-weight="700">기존 — 파일 전체를 메모리에 올린다</text>

  <rect x="40" y="58" width="170" height="62" fill="none" stroke="#A63A2B" stroke-width="1.5"/>
  <text x="125" y="84" text-anchor="middle" font-size="13.5" fill="#A63A2B">파일 수신 · 저장</text>
  <text x="125" y="104" text-anchor="middle" font-size="12" fill="#A63A2B">디스크</text>

  <line x1="210" y1="89" x2="246" y2="89" stroke="#A63A2B" stroke-width="1.5" marker-end="url(#xar)"/>

  <rect x="246" y="58" width="210" height="62" fill="none" stroke="#A63A2B" stroke-width="1.8"/>
  <text x="351" y="84" text-anchor="middle" font-size="13.5" fill="#A63A2B" font-weight="700">엑셀 전체 파싱</text>
  <text x="351" y="104" text-anchor="middle" font-size="12" fill="#A63A2B">파일 전체를 객체로 메모리 적재</text>

  <line x1="456" y1="89" x2="492" y2="89" stroke="#A63A2B" stroke-width="1.5" marker-end="url(#xar)"/>

  <rect x="492" y="58" width="210" height="62" fill="none" stroke="#A63A2B" stroke-width="1.5"/>
  <text x="597" y="84" text-anchor="middle" font-size="13.5" fill="#A63A2B">저장</text>
  <text x="597" y="104" text-anchor="middle" font-size="12" fill="#A63A2B">업로드 전체가 1 트랜잭션</text>

  <text x="246" y="146" font-size="13" fill="#A63A2B" font-weight="700">→ 행이 많아지면 파일 전체를 메모리에 올리지 못해 OOM</text>

  <!-- 전환 -->
  <line x1="400" y1="170" x2="400" y2="214" stroke="#131A20" stroke-width="2.6" marker-end="url(#xbig)"/>

  <!-- 신규 -->
  <text x="16" y="252" font-family="ui-monospace, monospace" font-size="15" fill="#0B8A73" font-weight="700">신규 — 행 단위로 읽고, 청크마다 커밋한다</text>

  <rect x="40" y="270" width="150" height="62" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="115" y="296" text-anchor="middle" font-size="13.5" fill="currentColor">파일 수신 · 저장</text>
  <text x="115" y="316" text-anchor="middle" font-size="12" fill="currentColor">디스크</text>

  <line x1="190" y1="301" x2="222" y2="301" stroke="currentColor" stroke-width="1.5" marker-end="url(#xa)"/>

  <rect x="222" y="270" width="160" height="62" fill="#0B8A73" fill-opacity=".06" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="302" y="296" text-anchor="middle" font-size="13.5" fill="#0B8A73" font-weight="700">행 단위 읽기</text>
  <text x="302" y="316" text-anchor="middle" font-size="12" fill="#0B8A73">읽힐 때마다 콜백</text>

  <line x1="382" y1="301" x2="414" y2="301" stroke="currentColor" stroke-width="1.5" marker-end="url(#xa)"/>

  <rect x="414" y="270" width="150" height="62" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="489" y="296" text-anchor="middle" font-size="13.5" fill="currentColor">헤더 매칭 · 변환</text>
  <text x="489" y="316" text-anchor="middle" font-size="12" fill="currentColor">그 자리에서 처리</text>

  <line x1="564" y1="301" x2="596" y2="301" stroke="currentColor" stroke-width="1.5" marker-end="url(#xa)"/>

  <rect x="596" y="270" width="170" height="62" fill="none" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="681" y="296" text-anchor="middle" font-size="13.5" fill="#0B8A73" font-weight="700">앞단 검증 게이트</text>
  <text x="681" y="316" text-anchor="middle" font-size="12" fill="#0B8A73">타입 · 필수값 · 형식</text>

  <line x1="766" y1="301" x2="798" y2="301" stroke="#0B8A73" stroke-width="1.7" marker-end="url(#xag)"/>

  <rect x="798" y="270" width="190" height="62" fill="#0B8A73" fill-opacity=".06" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="893" y="296" text-anchor="middle" font-size="13.5" fill="#0B8A73" font-weight="700">1,000건 묶음 저장</text>
  <text x="893" y="316" text-anchor="middle" font-size="12" fill="#0B8A73">청크마다 커밋 · 순서 보존</text>

  <line x1="681" y1="332" x2="681" y2="382" stroke="#A63A2B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#xar)"/>

  <rect x="596" y="382" width="170" height="54" fill="none" stroke="#A63A2B" stroke-width="1.5"/>
  <text x="681" y="406" text-anchor="middle" font-size="13" fill="#A63A2B" font-weight="700">그 행만 반려</text>
  <text x="681" y="425" text-anchor="middle" font-size="11.5" fill="#A63A2B">저장 단계까지 가지 않는다</text>

  <line x1="893" y1="332" x2="893" y2="382" stroke="#0B8A73" stroke-width="1.5" marker-end="url(#xag)"/>

  <rect x="798" y="382" width="190" height="54" fill="none" stroke="#0B8A73" stroke-width="1.5"/>
  <text x="893" y="406" text-anchor="middle" font-size="13" fill="#0B8A73" font-weight="700">청크 상태 기록</text>
  <text x="893" y="425" text-anchor="middle" font-size="11.5" fill="#0B8A73">대기 · 처리중 · 완료 · 실패</text>

  <text x="40" y="480" font-size="13" fill="#0B8A73" font-weight="700">→ 파일 전체를 메모리에 올리지 않으므로 행이 늘어도 메모리 사용량이 함께 늘지 않는다</text>
  <text x="40" y="504" font-size="13" fill="#131A20">청크마다 커밋해 전체 트랜잭션은 걸 수 없지만, 기록된 상태로 재실행하면 남은 청크부터 이어서 처리한다</text>
</svg>
