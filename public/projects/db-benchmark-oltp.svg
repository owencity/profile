<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" style="color:#131A20"
     aria-label="sysbench 4종 워크로드(point_select, insert, read_only, read_write) 처리량 비교. 모든 항목에서 PostgreSQL이 MySQL보다 높지만 격차는 항목마다 다르다">
  <rect width="720" height="300" fill="#F7F9FA"/>

  <rect x="470" y="18" width="12" height="12" fill="currentColor" opacity=".45"/>
  <text x="488" y="28" font-size="11.5" fill="currentColor" opacity=".75">MySQL 8.4</text>
  <rect x="580" y="18" width="12" height="12" fill="#0B8A73"/>
  <text x="598" y="28" font-size="11.5" fill="#0B8A73">PostgreSQL 16</text>

  <line x1="40" y1="220" x2="700" y2="220" stroke="currentColor" opacity=".3"/>

  <!-- point_select: 13,636 / 22,495 -->
  <rect x="96" y="113" width="30" height="107" fill="currentColor" opacity=".45"/>
  <text x="111" y="106" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".8">13,636</text>
  <rect x="130" y="44" width="30" height="176" fill="#0B8A73"/>
  <text x="145" y="37" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0B8A73">22,495</text>
  <text x="128" y="240" text-anchor="middle" font-size="11.5" fill="currentColor">point_select</text>
  <text x="128" y="255" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">/s</text>

  <!-- insert: 1,319 / 5,117 -->
  <rect x="286" y="210" width="30" height="10" fill="currentColor" opacity=".45"/>
  <text x="301" y="203" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".8">1,319</text>
  <rect x="320" y="180" width="30" height="40" fill="#0B8A73"/>
  <text x="335" y="173" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0B8A73">5,117</text>
  <text x="318" y="240" text-anchor="middle" font-size="11.5" fill="currentColor">insert</text>
  <text x="318" y="255" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">/s</text>

  <!-- read_only: 793 / 1,146 -->
  <rect x="476" y="214" width="30" height="6" fill="currentColor" opacity=".45"/>
  <text x="491" y="204" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".8">793</text>
  <rect x="510" y="211" width="30" height="9" fill="#0B8A73"/>
  <text x="525" y="201" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0B8A73">1,146</text>
  <text x="508" y="240" text-anchor="middle" font-size="11.5" fill="currentColor">read_only</text>
  <text x="508" y="255" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">tps</text>

  <!-- read_write: 397 / 708 -->
  <rect x="606" y="217" width="30" height="3" fill="currentColor" opacity=".45"/>
  <text x="621" y="207" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".8">397</text>
  <rect x="640" y="214" width="30" height="6" fill="#0B8A73"/>
  <text x="655" y="204" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0B8A73">708</text>
  <text x="638" y="240" text-anchor="middle" font-size="11.5" fill="currentColor">read_write</text>
  <text x="638" y="255" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">tps</text>

  <text x="40" y="280" font-size="11.5" fill="#A63A2B">가장 느린 insert 요청 기준: MySQL 44ms vs PostgreSQL 268ms — 처리량은 밀려도 꼬리 지연은 MySQL이 안정적</text>
</svg>
