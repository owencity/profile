<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" style="color:#131A20"
     aria-label="종전에는 업로드 화면과 저장 프로시저가 각각 다른 기준으로 등록 모드를 판정해 결론이 어긋나 24행이 반려됐고, 수정 후에는 두 곳이 같은 판정 함수를 호출해 결론이 하나로 모인다는 비교 도해">
  <rect width="880" height="430" fill="#F7F9FA"/>
  <defs>
    <marker id="stabJ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="stabJok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B8A73"/>
    </marker>
    <pattern id="stabHatchD" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#A63A2B" stroke-width="2.2" opacity=".3"/>
    </pattern>
  </defs>

  <text x="16" y="40" font-size="12" font-family="ui-monospace, monospace" fill="#A63A2B">종전</text>

  <rect x="80" y="50" width="160" height="46" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="160" y="78" text-anchor="middle" font-size="13" fill="currentColor">업로드 화면</text>
  <line x1="240" y1="73" x2="290" y2="73" stroke="#A63A2B" stroke-width="1.3" marker-end="url(#stabJ)"/>
  <rect x="290" y="50" width="230" height="46" fill="none" stroke="#A63A2B" stroke-width="1.4"/>
  <text x="405" y="70" text-anchor="middle" font-size="12.5" fill="#A63A2B">판정 A</text>
  <text x="405" y="87" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#A63A2B">이 단가표에 처음 올라온 건가</text>
  <line x1="520" y1="73" x2="570" y2="73" stroke="#A63A2B" stroke-width="1.3" marker-end="url(#stabJ)"/>
  <rect x="570" y="50" width="170" height="46" fill="none" stroke="#A63A2B" stroke-width="1.4"/>
  <text x="655" y="78" text-anchor="middle" font-size="13" fill="#A63A2B">"최초 등록"</text>

  <rect x="80" y="120" width="160" height="46" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="160" y="148" text-anchor="middle" font-size="13" fill="currentColor">저장 프로시저</text>
  <line x1="240" y1="143" x2="290" y2="143" stroke="#A63A2B" stroke-width="1.3" marker-end="url(#stabJ)"/>
  <rect x="290" y="120" width="230" height="46" fill="none" stroke="#A63A2B" stroke-width="1.4"/>
  <text x="405" y="140" text-anchor="middle" font-size="12.5" fill="#A63A2B">판정 B</text>
  <text x="405" y="157" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#A63A2B">옵션·매입처 쌍이 이미 있는가</text>
  <line x1="520" y1="143" x2="570" y2="143" stroke="#A63A2B" stroke-width="1.3" marker-end="url(#stabJ)"/>
  <rect x="570" y="120" width="170" height="46" fill="url(#stabHatchD)" stroke="#A63A2B" stroke-width="1.4"/>
  <text x="655" y="148" text-anchor="middle" font-size="13" fill="#A63A2B">"이미 있음"</text>

  <text x="80" y="200" font-size="13" fill="#A63A2B" font-weight="700">→ 결론이 어긋나 24행 반려</text>
  <text x="80" y="222" font-size="12" fill="currentColor">두 판정 모두 자기 기준으로는 정확했다 — 기준이 둘이라는 것이 결함이었다</text>

  <line x1="16" y1="256" x2="864" y2="256" stroke="currentColor" opacity=".2"/>

  <text x="16" y="296" font-size="12" font-family="ui-monospace, monospace" fill="#0B8A73">수정 후</text>

  <rect x="80" y="290" width="160" height="42" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="160" y="316" text-anchor="middle" font-size="13" fill="currentColor">업로드 화면</text>
  <rect x="80" y="348" width="160" height="42" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="160" y="374" text-anchor="middle" font-size="13" fill="currentColor">저장 프로시저</text>

  <polyline points="240,311 275,311 275,340" fill="none" stroke="#0B8A73" stroke-width="1.4"/>
  <polyline points="240,369 275,369 275,340" fill="none" stroke="#0B8A73" stroke-width="1.4"/>
  <line x1="275" y1="340" x2="330" y2="340" stroke="#0B8A73" stroke-width="1.4" marker-end="url(#stabJok)"/>

  <rect x="330" y="316" width="250" height="50" fill="none" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="455" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#0B8A73">판정 함수 한 벌</text>
  <text x="455" y="355" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#0B8A73">옵션·매입처 쌍이 이미 있는가</text>

  <line x1="580" y1="340" x2="630" y2="340" stroke="#0B8A73" stroke-width="1.4" marker-end="url(#stabJok)"/>
  <rect x="630" y="316" width="180" height="50" fill="none" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="720" y="337" text-anchor="middle" font-size="13" fill="#0B8A73">결론 하나</text>
  <text x="720" y="355" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#0B8A73">화면 배지 = 저장 동작</text>

  <text x="80" y="410" font-size="13" fill="#0B8A73" font-weight="700">→ 행마다 조회하지 않고 쌍 목록 전체를 집합 질의 1회로 판정 — 10만 행이어도 질의 1회</text>
</svg>
