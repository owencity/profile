<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 556" role="img" style="color:#131A20"
     aria-label="무한 재시도가 발생하던 기존 구조와 이를 해결한 신규 구조 비교. 기존에는 작업 전체가 메시지 한 건이라 스스로 멈추는 장치가 없었고, 작업이 브로커의 배달 확인 3시간을 넘기면 브로커가 컨슈머를 죽은 것으로 판단해 메시지를 회수하고 다시 배달했다. 그러면 처음부터 다시 시작되고 재시도 횟수까지 초기화돼 3회 제한에 영원히 닿지 못하고 DLQ로도 가지 못한 채 같은 작업이 자원만 계속 소모했다. 신규 구조에서는 브로커의 배달 확인 3시간 안에 처리 예산 60분을 두고, 그 안에서 0.6에서 0.8초짜리 청크를 반복하며 끝날 때마다 커밋한다. 예산 60분이 소진되면 작업이 스스로 종료하므로 브로커가 개입할 일이 없고, 남은 청크는 다음 실행이 이어받으며 재시도 횟수가 정상 누적돼 3회를 넘기면 DLQ로 간다.">
  <rect width="1000" height="556" fill="#F7F9FA"/>
  <defs>
    <marker id="tg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B8A73"/>
    </marker>
    <marker id="tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A63A2B"/>
    </marker>
    <marker id="tbig" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#131A20"/>
    </marker>
  </defs>

  <!-- 기존 -->
  <text x="16" y="42" font-family="ui-monospace, monospace" font-size="15" fill="#A63A2B" font-weight="700">기존 — 무한 재시도가 발생하는 구조</text>

  <rect x="40" y="62" width="430" height="86" fill="none" stroke="#A63A2B" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="56" y="84" font-size="13" fill="#A63A2B" font-weight="700">브로커 배달 확인 — 3시간</text>

  <text x="66" y="110" font-size="12" fill="#131A20">작업 전체가 메시지 1건 — 끝나지 않은 채 3시간을 넘긴다</text>
  <line x1="66" y1="128" x2="856" y2="128" stroke="#A63A2B" stroke-width="2.2" marker-end="url(#tr)"/>

  <line x1="470" y1="62" x2="470" y2="166" stroke="#A63A2B" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="480" y="158" font-size="12.5" fill="#A63A2B" font-weight="700">여기서 브로커가 회수 → 재배달</text>

  <path d="M856 140 L856 188 L66 188 L66 140" fill="none" stroke="#A63A2B" stroke-width="1.6" marker-end="url(#tr)"/>
  <text x="392" y="208" font-size="12.5" fill="#A63A2B" font-weight="700">처음부터 다시</text>

  <text x="40" y="240" font-size="13" fill="#A63A2B" font-weight="700">→ 재시도 횟수까지 초기화된다 — 3회 제한에 영원히 닿지 않아 DLQ로도 가지 못한다</text>
  <text x="40" y="262" font-size="12.5" fill="#131A20">실패가 드러나지 않고, 같은 작업이 조용히 자원만 계속 먹는 상태가 된다</text>

  <!-- 전환 -->
  <line x1="500" y1="286" x2="500" y2="330" stroke="#131A20" stroke-width="2.6" marker-end="url(#tbig)"/>

  <!-- 신규 -->
  <text x="16" y="368" font-family="ui-monospace, monospace" font-size="15" fill="#0B8A73" font-weight="700">신규 — 해결한 구조</text>

  <rect x="40" y="384" width="720" height="134" fill="none" stroke="#0B8A73" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="56" y="406" font-size="13" fill="#0B8A73" font-weight="700">브로커 배달 확인 — 3시간</text>

  <rect x="64" y="420" width="430" height="86" fill="#0B8A73" fill-opacity=".06" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="80" y="441" font-size="13" fill="#0B8A73" font-weight="700">처리 예산 — 60분</text>

  <rect x="80" y="452" width="32" height="24" fill="none" stroke="#0B8A73" stroke-width="1.3"/>
  <rect x="120" y="452" width="32" height="24" fill="none" stroke="#0B8A73" stroke-width="1.3"/>
  <rect x="160" y="452" width="32" height="24" fill="none" stroke="#0B8A73" stroke-width="1.3"/>
  <rect x="200" y="452" width="32" height="24" fill="none" stroke="#0B8A73" stroke-width="1.3"/>
  <rect x="240" y="452" width="32" height="24" fill="none" stroke="#0B8A73" stroke-width="1.3"/>
  <rect x="280" y="452" width="32" height="24" fill="none" stroke="#0B8A73" stroke-width="1.3"/>
  <rect x="320" y="452" width="32" height="24" fill="none" stroke="#0B8A73" stroke-width="1.3"/>
  <text x="364" y="469" font-size="12" fill="#0B8A73">· · ·</text>
  <text x="80" y="496" font-size="12" fill="#131A20">청크 1회 0.6~0.8초 · 끝날 때마다 커밋</text>

  <line x1="494" y1="462" x2="524" y2="462" stroke="#0B8A73" stroke-width="1.7" marker-end="url(#tg)"/>
  <text x="532" y="456" font-size="12.5" fill="#0B8A73" font-weight="700">예산 소진 → 스스로 종료</text>
  <text x="532" y="476" font-size="12" fill="#131A20">브로커가 손댈 일이 없다</text>

  <text x="40" y="546" font-size="13" fill="#0B8A73" font-weight="700">→ 남은 청크는 다음 실행이 이어받고, 재시도 횟수가 정상 누적돼 3회를 넘기면 DLQ로 간다</text>
</svg>
