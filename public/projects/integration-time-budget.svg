<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" style="color:#131A20"
     aria-label="컨슈머의 처리 예산이 브로커의 배달 확인 대기 시간보다 짧으면 스스로 멈추고 이어서 처리하지만, 순서가 뒤집히면 브로커가 먼저 메시지를 회수해 처음부터 다시 시작하고 재시도 횟수도 초기화되어 무한 반복이 된다는 비교 도해">
  <rect width="880" height="430" fill="#F7F9FA"/>
  <defs>
    <marker id="itb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="itbr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A63A2B"/>
    </marker>
  </defs>

  <text x="16" y="36" font-family="ui-monospace, monospace" font-size="12.5" fill="#0B8A73" font-weight="700">채택</text>
  <text x="150" y="36" font-size="13" fill="currentColor">안쪽 층이 먼저 끊도록 예산을 겹쳐 둔다</text>

  <text x="16" y="66" font-size="12" fill="currentColor" opacity=".7">브로커</text>
  <rect x="150" y="54" width="670" height="16" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
  <text x="828" y="66" font-size="12" font-family="ui-monospace, monospace" fill="currentColor" opacity=".7">3시간</text>

  <text x="16" y="96" font-size="12" fill="#0B8A73">처리 예산</text>
  <rect x="150" y="84" width="223" height="16" fill="none" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="381" y="96" font-size="12" font-family="ui-monospace, monospace" fill="#0B8A73">60분 — 여기서 스스로 멈춘다</text>

  <text x="16" y="126" font-size="12" fill="currentColor" opacity=".7">청크</text>
  <g stroke="currentColor" stroke-width="1.2" opacity=".6">
    <rect x="150" y="114" width="14" height="16" fill="none"/>
    <rect x="168" y="114" width="14" height="16" fill="none"/>
    <rect x="186" y="114" width="14" height="16" fill="none"/>
    <rect x="204" y="114" width="14" height="16" fill="none"/>
    <rect x="222" y="114" width="14" height="16" fill="none"/>
    <rect x="240" y="114" width="14" height="16" fill="none"/>
  </g>
  <text x="266" y="126" font-size="12" font-family="ui-monospace, monospace" fill="currentColor" opacity=".7">1회 0.6~0.8초 · 각 청크마다 커밋</text>

  <text x="150" y="160" font-size="13" fill="#0B8A73" font-weight="700">→ 남은 청크는 다음 실행이 이어받는다 · 재시도 횟수는 그대로 누적된다</text>

  <line x1="16" y1="194" x2="864" y2="194" stroke="currentColor" opacity=".2"/>

  <text x="16" y="230" font-family="ui-monospace, monospace" font-size="12.5" fill="#A63A2B" font-weight="700">뒤집히면</text>
  <text x="150" y="230" font-size="13" fill="currentColor">바깥 층이 먼저 끊는다 — 스스로 멈추는 장치가 없거나 더 길 때</text>

  <text x="16" y="266" font-size="12" fill="#A63A2B">실제 작업</text>
  <line x1="150" y1="262" x2="846" y2="262" stroke="#A63A2B" stroke-width="1.8" marker-end="url(#itbr)"/>
  <text x="700" y="254" font-size="12" font-family="ui-monospace, monospace" fill="#A63A2B">계속 진행 중…</text>

  <text x="16" y="296" font-size="12" fill="currentColor" opacity=".7">브로커</text>
  <rect x="150" y="284" width="450" height="16" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/>

  <line x1="600" y1="242" x2="600" y2="318" stroke="#A63A2B" stroke-width="1.5"/>
  <text x="610" y="310" font-size="12" font-family="ui-monospace, monospace" fill="#A63A2B">여기서 브로커가 회수</text>

  <polyline points="600,318 600,346 150,346 150,320" fill="none"
            stroke="#A63A2B" stroke-width="1.5" marker-end="url(#itbr)"/>
  <text x="375" y="364" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#A63A2B">다시 배달 → 청크 1번부터</text>

  <text x="150" y="396" font-size="13" fill="#A63A2B" font-weight="700">→ 재시도 횟수도 함께 초기화된다 — 3회 제한에 영원히 닿지 않아 DLQ로도 못 간다</text>
  <text x="150" y="416" font-size="12" fill="currentColor" opacity=".72">실패가 시끄럽게 드러나지 않고, 같은 작업이 조용히 자원을 계속 먹는 형태가 된다</text>
</svg>
