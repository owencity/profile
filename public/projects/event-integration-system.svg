<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" style="color:#131A20"
     aria-label="자사몰 연동 구조 비교. 기존에는 웹 관리 콘솔에서 애플리케이션 서버를 거쳐 운영 DB에 저장한 뒤, 스케줄러가 주기적으로 폴링해 자사몰 API로 보냈다. 폴링 사이에 실패한 건은 유실되고 수동으로 복구해야 했으며 장애 한 번이 연동 전체를 지연시켰다. 신규 구조에서는 사용자가 입력한 데이터가 애플리케이션 서버를 거쳐 운영 DB에 적재되고, 적재한 데이터를 그대로 RabbitMQ에 발행한다. 연동 컨슈머가 prefetch 1에 2~4 병렬로 소비해 자사몰 HTTPS API로 보내고, 재시도를 3회 소진한 건은 DLQ로 격리된다.">
  <rect width="1200" height="600" fill="#F7F9FA"/>
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="ear" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A63A2B"/>
    </marker>
    <marker id="eag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B8A73"/>
    </marker>
    <marker id="eabig" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#131A20"/>
    </marker>
  </defs>

  <!-- ===== 기존 ===== -->
  <text x="16" y="40" font-family="ui-monospace, monospace" font-size="15" fill="#A63A2B" font-weight="700">기존 — 스케줄러 폴링</text>

  <rect x="40" y="62" width="140" height="62" fill="none" stroke="#A63A2B" stroke-width="1.5"/>
  <text x="110" y="99" text-anchor="middle" font-size="14" fill="#A63A2B">웹 관리 콘솔</text>

  <line x1="180" y1="93" x2="216" y2="93" stroke="#A63A2B" stroke-width="1.5" marker-end="url(#ear)"/>

  <rect x="216" y="62" width="170" height="62" fill="none" stroke="#A63A2B" stroke-width="1.5"/>
  <text x="301" y="99" text-anchor="middle" font-size="14" fill="#A63A2B">애플리케이션 서버</text>

  <line x1="386" y1="93" x2="422" y2="93" stroke="#A63A2B" stroke-width="1.5" marker-end="url(#ear)"/>

  <rect x="422" y="62" width="140" height="62" fill="none" stroke="#A63A2B" stroke-width="1.5"/>
  <text x="492" y="99" text-anchor="middle" font-size="14" fill="#A63A2B">운영 DB</text>

  <line x1="562" y1="93" x2="598" y2="93" stroke="#A63A2B" stroke-width="1.5" marker-end="url(#ear)"/>

  <rect x="598" y="62" width="170" height="62" fill="none" stroke="#A63A2B" stroke-width="1.8"/>
  <text x="683" y="88" text-anchor="middle" font-size="14" fill="#A63A2B" font-weight="700">스케줄러</text>
  <text x="683" y="108" text-anchor="middle" font-size="12" fill="#A63A2B">주기 폴링</text>

  <line x1="768" y1="93" x2="804" y2="93" stroke="#A63A2B" stroke-width="1.5" marker-end="url(#ear)"/>

  <rect x="804" y="62" width="160" height="62" fill="none" stroke="#A63A2B" stroke-width="1.5"/>
  <text x="884" y="99" text-anchor="middle" font-size="14" fill="#A63A2B">자사몰 API</text>

  <text x="598" y="148" font-size="12.5" fill="#A63A2B">폴링 사이에 실패한 건은 유실 · 수동 복구 · 장애 1회가 연동 전체를 지연</text>

  <!-- 전환 -->
  <line x1="600" y1="176" x2="600" y2="220" stroke="#131A20" stroke-width="2.6" marker-end="url(#eabig)"/>

  <!-- ===== 신규 ===== -->
  <text x="16" y="256" font-family="ui-monospace, monospace" font-size="15" fill="#0B8A73" font-weight="700">신규 — 이벤트 기반</text>

  <rect x="40" y="278" width="120" height="62" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="100" y="315" text-anchor="middle" font-size="14" fill="currentColor">사용자</text>

  <line x1="160" y1="309" x2="196" y2="309" stroke="currentColor" stroke-width="1.5" marker-end="url(#ea)"/>
  <text x="162" y="300" font-size="11.5" fill="currentColor">입력</text>

  <rect x="196" y="278" width="150" height="62" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="271" y="315" text-anchor="middle" font-size="14" fill="currentColor">웹 관리 콘솔</text>

  <line x1="346" y1="309" x2="382" y2="309" stroke="currentColor" stroke-width="1.5" marker-end="url(#ea)"/>
  <text x="348" y="300" font-size="11.5" fill="currentColor">REST</text>

  <rect x="382" y="278" width="180" height="62" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="472" y="304" text-anchor="middle" font-size="14" fill="currentColor" font-weight="700">애플리케이션 서버</text>
  <text x="472" y="324" text-anchor="middle" font-size="12" fill="currentColor">상품 · 가격 · 배송 도메인</text>

  <line x1="562" y1="309" x2="598" y2="309" stroke="currentColor" stroke-width="1.5" marker-end="url(#ea)"/>

  <rect x="598" y="278" width="150" height="62" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="673" y="304" text-anchor="middle" font-size="14" fill="currentColor">운영 DB</text>
  <text x="673" y="324" text-anchor="middle" font-size="12" fill="currentColor">PostgreSQL</text>

  <line x1="748" y1="309" x2="784" y2="309" stroke="#0B8A73" stroke-width="1.7" marker-end="url(#eag)"/>
  <text x="730" y="268" font-size="12" fill="#0B8A73" font-weight="700">적재한 데이터를 그대로 발행</text>

  <rect x="784" y="278" width="170" height="62" fill="#0B8A73" fill-opacity=".06" stroke="#0B8A73" stroke-width="1.8"/>
  <text x="869" y="304" text-anchor="middle" font-size="14" fill="#0B8A73" font-weight="700">RabbitMQ</text>
  <text x="869" y="324" text-anchor="middle" font-size="12" fill="#0B8A73">작업 지시만 (약 100B)</text>

  <line x1="869" y1="340" x2="869" y2="404" stroke="#0B8A73" stroke-width="1.7" marker-end="url(#eag)"/>
  <text x="880" y="378" font-size="12" fill="#0B8A73">소비</text>

  <rect x="784" y="404" width="170" height="62" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="869" y="430" text-anchor="middle" font-size="14" fill="currentColor" font-weight="700">연동 컨슈머</text>
  <text x="869" y="450" text-anchor="middle" font-size="12" fill="currentColor">prefetch 1 · 2~4 병렬</text>

  <line x1="954" y1="435" x2="990" y2="435" stroke="currentColor" stroke-width="1.5" marker-end="url(#ea)"/>
  <text x="958" y="426" font-size="11.5" fill="currentColor">전송</text>

  <rect x="990" y="404" width="170" height="62" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="1075" y="430" text-anchor="middle" font-size="14" fill="currentColor">자사몰</text>
  <text x="1075" y="450" text-anchor="middle" font-size="12" fill="currentColor">HTTPS API · 500건 단위</text>

  <line x1="869" y1="466" x2="869" y2="518" stroke="#A63A2B" stroke-width="1.6" marker-end="url(#ear)"/>
  <text x="880" y="496" font-size="12" fill="#A63A2B">재시도 3회 소진</text>

  <rect x="784" y="518" width="170" height="58" fill="none" stroke="#A63A2B" stroke-width="1.6"/>
  <text x="869" y="542" text-anchor="middle" font-size="14" fill="#A63A2B" font-weight="700">DLQ</text>
  <text x="869" y="562" text-anchor="middle" font-size="12" fill="#A63A2B">14일 보존 · 즉시 알림</text>

  <rect x="40" y="404" width="300" height="62" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="190" y="430" text-anchor="middle" font-size="13.5" fill="currentColor">멱등 처리 · 수동 재처리 화면</text>
  <text x="190" y="450" text-anchor="middle" font-size="12" fill="currentColor">중복 전송에도 한 번만 반영</text>

  <rect x="40" y="494" width="300" height="62" fill="none" stroke="#0B8A73" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="190" y="520" text-anchor="middle" font-size="13.5" fill="#0B8A73">Prometheus · Loki · Grafana</text>
  <text x="190" y="540" text-anchor="middle" font-size="12" fill="#0B8A73">규칙 기반 이상 탐지 → 웹훅 알림</text>
</svg>
