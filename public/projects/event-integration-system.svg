    </marker>
  </defs>

  <text x="16" y="46" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="currentColor">동기</text>
  <text x="16" y="290" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="currentColor">비동기</text>
