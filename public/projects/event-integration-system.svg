<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" style="color:#131A20"
     aria-label="클라이언트에서 애플리케이션을 거쳐 데이터베이스로 가는 동기 경로와, 애플리케이션에서 메시지 브로커와 컨슈머를 거쳐 외부 커머스 API로 가는 비동기 경로를 분리한 시스템 구성도">
  <rect width="900" height="470" fill="#F7F9FA"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
