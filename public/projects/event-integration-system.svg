<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" style="color:#131A20"
     aria-label="웹 관리 콘솔에서 애플리케이션을 거쳐 운영 DB로 상품 데이터가 입력되는 경로와, 그 이력을 판별해 메시지 브로커와 컨슈머를 거쳐 외부 커머스 API로 반영하는 이벤트 기반 자사몰 연동 경로를 보여주는 시스템 구성도">
  <rect width="900" height="470" fill="#F7F9FA"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="16" y="46" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="currentColor">① 상품 데이터 입력</text>
  <text x="16" y="272" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="currentColor">② 자사몰 연동 (이벤트 기반)</text>
  <line x1="16" y1="238" x2="884" y2="238" stroke="currentColor" stroke-width="1" opacity=".22" stroke-dasharray="3 5"/>
  <text x="884" y="258" text-anchor="end" font-size="11.5" fill="currentColor" opacity=".65">운영 DB의 최초등록이력·수정이력을 기준으로 자사몰 반영 대상을 판별해 ②로 넘깁니다</text>

  <rect x="70" y="88" width="150" height="52" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="145" y="112" text-anchor="middle" font-size="13.5" fill="currentColor">웹 관리 콘솔</text>
  <text x="145" y="129" text-anchor="middle" font-size="12" fill="currentColor">React</text>

  <rect x="320" y="44" width="230" height="140" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="435" y="66" text-anchor="middle" font-size="13.5" font-weight="700" fill="currentColor">애플리케이션 서버</text>
  <line x1="320" y1="76" x2="550" y2="76" stroke="currentColor" opacity=".3"/>
  <text x="338" y="98" font-size="12.5" fill="currentColor">상품 · 가격 · 배송 도메인</text>
  <text x="338" y="122" font-size="12.5" fill="currentColor">대용량 배치 (청크 · 스트리밍)</text>
  <text x="338" y="146" font-size="12.5" fill="currentColor">엑셀 파싱 · 양식 검증</text>
  <text x="338" y="170" font-size="12.5" fill="currentColor">외부 연동 클라이언트</text>

  <rect x="670" y="88" width="180" height="52" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="760" y="112" text-anchor="middle" font-size="13.5" fill="currentColor">운영 DB</text>
  <text x="760" y="129" text-anchor="middle" font-size="12" fill="currentColor">PostgreSQL</text>

  <line x1="220" y1="114" x2="320" y2="114" stroke="currentColor" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="270" y="106" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="currentColor">REST</text>

  <line x1="550" y1="114" x2="670" y2="114" stroke="currentColor" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="70" y="284" width="150" height="54" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="145" y="308" text-anchor="middle" font-size="13.5" fill="currentColor">동기화 트리거</text>
  <text x="145" y="325" text-anchor="middle" font-size="12" fill="currentColor">버튼 · 야간 스케줄</text>

  <rect x="300" y="284" width="150" height="54" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="375" y="308" text-anchor="middle" font-size="13.5" font-weight="700" fill="currentColor">메시지 브로커</text>
  <text x="375" y="325" text-anchor="middle" font-size="12" fill="currentColor">RabbitMQ</text>

  <rect x="530" y="284" width="150" height="54" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="605" y="308" text-anchor="middle" font-size="13.5" fill="currentColor">연동 컨슈머</text>
  <text x="605" y="325" text-anchor="middle" font-size="12" fill="currentColor">prefetch 1 · 2~4 병렬</text>

  <rect x="760" y="284" width="124" height="54" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="822" y="308" text-anchor="middle" font-size="13.5" fill="currentColor">외부 커머스</text>
  <text x="822" y="325" text-anchor="middle" font-size="12" fill="currentColor">HTTPS API</text>

  <line x1="220" y1="311" x2="300" y2="311" stroke="currentColor" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="260" y="303" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="currentColor">발행</text>
  <line x1="450" y1="311" x2="530" y2="311" stroke="currentColor" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="490" y="303" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="currentColor">소비</text>
  <line x1="680" y1="311" x2="760" y2="311" stroke="currentColor" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="720" y="303" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="currentColor">upsert</text>

  <rect x="300" y="392" width="150" height="48" fill="none" stroke="#A63A2B" stroke-width="1.5"/>
  <text x="375" y="414" text-anchor="middle" font-size="13.5" fill="#A63A2B">DLQ</text>
  <text x="375" y="430" text-anchor="middle" font-size="12" fill="#A63A2B">14일 보존 · 상한</text>
  <line x1="375" y1="338" x2="375" y2="392" stroke="#A63A2B" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="386" y="368" font-size="12" font-family="ui-monospace, monospace" fill="#A63A2B">재시도 소진</text>

  <rect x="600" y="392" width="284" height="48" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="742" y="414" text-anchor="middle" font-size="13" fill="currentColor">로그 수집 · 대시보드 · 알람</text>
  <text x="742" y="430" text-anchor="middle" font-size="12" fill="currentColor">DLQ 진입 시 즉시 통보</text>
  <line x1="605" y1="338" x2="680" y2="392" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a1)"/>
  <line x1="450" y1="416" x2="600" y2="416" stroke="#A63A2B" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#a1)"/>
</svg>
